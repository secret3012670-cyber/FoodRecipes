<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>4x4 카드 뒤집기 게임 (Memory Match)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Pretendard', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .font-jua {
      font-family: 'Jua', sans-serif;
    }

    /* 3D 카드 플립 스타일 */
    .perspective-1000 {
      perspective: 1000px;
    }

    .transform-style-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* 카드 흔들림 애니메이션 (불일치 시) */
    @keyframes shakeCard {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      20%, 60% { transform: rotateY(180deg) translateX(-6px); }
      40%, 80% { transform: rotateY(180deg) translateX(6px); }
    }

    .shake {
      animation: shakeCard 0.45s ease-in-out;
    }

    /* 카드 통통 튀는 애니메이션 (매칭 성공 시) */
    @keyframes matchBounce {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.12); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .match-pop {
      animation: matchBounce 0.4s ease-out;
    }

    /* 배경 그라데이션 및 네온 글로우 */
    .bg-game-radial {
      background: radial-gradient(circle at 50% 20%, #2b1f4d 0%, #17112b 60%, #0d091a 100%);
    }

    .card-shadow {
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .matched-glow {
      box-shadow: 0 0 22px rgba(52, 211, 153, 0.65), inset 0 0 10px rgba(52, 211, 153, 0.4);
    }
  </style>
</head>
<body class="bg-game-radial min-h-screen text-slate-100 flex flex-col justify-between items-center p-3 sm:p-6 overflow-x-hidden">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-md flex flex-col items-center mt-2 mb-3">
    <div class="flex items-center gap-2 mb-1">
      <span class="text-3xl">🃏</span>
      <h1 class="text-2xl sm:text-3xl font-jua tracking-wide bg-gradient-to-r from-amber-300 via-pink-400 to-indigo-300 bg-clip-text text-transparent">
        카드 짝맞추기 4x4
      </h1>
    </div>
    <p class="text-xs sm:text-sm text-purple-200/70 font-medium">카드를 뒤집어 8쌍의 짝을 찾아보세요!</p>

    <!-- 스코어보드 & 상태 바 -->
    <div class="grid grid-cols-3 gap-2 sm:gap-3 w-full mt-4">
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-2.5 flex flex-col items-center shadow-md backdrop-blur-sm">
        <span class="text-[11px] text-slate-400 font-medium flex items-center gap-1">
          ⏱️ 시간
        </span>
        <span id="timerDisplay" class="font-jua text-lg sm:text-xl text-amber-300">00:00</span>
      </div>

      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-2.5 flex flex-col items-center shadow-md backdrop-blur-sm">
        <span class="text-[11px] text-slate-400 font-medium flex items-center gap-1">
          🔄 시도
        </span>
        <span id="movesDisplay" class="font-jua text-lg sm:text-xl text-sky-300">0</span>
      </div>

      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-2.5 flex flex-col items-center shadow-md backdrop-blur-sm">
        <span class="text-[11px] text-slate-400 font-medium flex items-center gap-1">
          ✨ 성공
        </span>
        <span id="matchesDisplay" class="font-jua text-lg sm:text-xl text-emerald-300">0 / 8</span>
      </div>
    </div>
  </header>

  <!-- 4x4 게임 보드 영역 -->
  <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center my-auto">
    <div class="w-full aspect-square max-w-[420px] p-2 bg-slate-900/60 border border-purple-500/20 rounded-3xl backdrop-blur-md shadow-2xl relative">
      <!-- 4x4 그리드 레이아웃 -->
      <div id="cardGrid" class="w-full h-full grid grid-cols-4 grid-rows-4 gap-2 sm:gap-2.5">
        <!-- 카드는 자바스크립트로 동적 생성됩니다 -->
      </div>
    </div>
  </main>

  <!-- 컨트롤 버튼 영역 -->
  <footer class="w-full max-w-md flex items-center justify-between gap-3 mt-4 mb-2">
    <button id="soundBtn" class="flex-1 flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 active:scale-95 transition-all text-slate-300 px-3 py-2.5 rounded-2xl border border-slate-700 text-sm font-semibold shadow">
      <span id="soundIcon">🔊</span>
      <span id="soundText">소리 켜짐</span>
    </button>
    <button id="restartBtn" class="flex-1 flex items-center justify-center gap-2 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 active:scale-95 transition-all text-white px-4 py-2.5 rounded-2xl font-bold shadow-lg shadow-pink-500/25 text-sm">
      <span>🔄</span>
      <span>다시 시작</span>
    </button>
  </footer>

  <!-- 승리 모달 & 축하 파티클 캔버스 -->
  <canvas id="fireworksCanvas" class="fixed inset-0 pointer-events-none z-40 hidden"></canvas>

  <div id="victoryModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-gradient-to-b from-slate-800 to-slate-900 border border-purple-400/40 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col items-center">
      <div class="text-5xl mb-2 animate-bounce">🏆</div>
      <h2 class="text-2xl sm:text-3xl font-jua text-amber-300 mb-1">축하합니다! 완료!</h2>
      <p class="text-sm text-slate-300 mb-6">모든 카드 짝을 완벽하게 맞추셨어요!</p>

      <!-- 결과 정보 -->
      <div class="w-full bg-slate-950/60 rounded-2xl p-4 border border-slate-700/70 mb-6 space-y-2.5 text-sm">
        <div class="flex justify-between items-center text-slate-300">
          <span>⏱️ 소요 시간</span>
          <span id="finalTime" class="font-jua text-base text-amber-300">00:00</span>
        </div>
        <div class="flex justify-between items-center text-slate-300">
          <span>🔄 시도 횟수</span>
          <span id="finalMoves" class="font-jua text-base text-sky-300">0회</span>
        </div>
        <div class="flex justify-between items-center text-slate-300">
          <span>⭐ 정확도 점수</span>
          <span id="finalRating" class="font-jua text-base text-pink-400">⭐⭐⭐</span>
        </div>
      </div>

      <button id="modalPlayAgainBtn" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold rounded-2xl shadow-lg shadow-teal-500/30 active:scale-95 transition-transform text-base">
        새 게임 시작하기
      </button>
    </div>
  </div>

  <script>
    /* 웹 오디오 API를 통한 효과음 생성 (외부 파일 다운로드 없이 100% 자립형) */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playFlip() {
        if (!this.enabled) return;
        this.initContext();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.08);
      }

      playMatch() {
        if (!this.enabled) return;
        this.initContext();
        if (!this.ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 아르페지오
        const now = this.ctx.currentTime;

        notes.forEach((freq, index) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const startTime = now + index * 0.06;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.22, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.25);
        });
      }

      playMismatch() {
        if (!this.enabled) return;
        this.initContext();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.2);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.2);
      }

      playVictory() {
        if (!this.enabled) return;
        this.initContext();
        if (!this.ctx) return;

        const melody = [
          { f: 523.25, d: 0.12 }, // C5
          { f: 659.25, d: 0.12 }, // E5
          { f: 783.99, d: 0.12 }, // G5
          { f: 1046.50, d: 0.35 } // C6
        ];

        let cursor = this.ctx.currentTime;
        melody.forEach(note => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.f, cursor);

          gain.gain.setValueAtTime(0.28, cursor);
          gain.gain.exponentialRampToValueAtTime(0.001, cursor + note.d);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(cursor);
          osc.stop(cursor + note.d);
          cursor += note.d * 0.9;
        });
      }
    }

    const sound = new SoundEngine();

    // 8개의 귀여운 동물/사물 이모지 (4x4 = 총 16장 필요)
    const CARD_ITEMS = [
      { id: 'lion', emoji: '🦁', name: '사자', color: 'from-amber-400 to-orange-500' },
      { id: 'panda', emoji: '🐼', name: '판다', color: 'from-slate-300 to-zinc-400' },
      { id: 'frog', emoji: '🐸', name: '개구리', color: 'from-emerald-400 to-green-600' },
      { id: 'fox', emoji: '🦊', name: '여우', color: 'from-orange-400 to-red-500' },
      { id: 'whale', emoji: '🐳', name: '고래', color: 'from-cyan-400 to-blue-600' },
      { id: 'unicorn', emoji: '🦄', name: '유니콘', color: 'from-fuchsia-400 to-pink-600' },
      { id: 'chick', emoji: '🐣', name: '병아리', color: 'from-yellow-300 to-amber-500' },
      { id: 'rabbit', emoji: '🐰', name: '토끼', color: 'from-rose-300 to-pink-500' }
    ];

    // 게임 상태 변수
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let timer = null;
    let secondsElapsed = 0;
    let isGameActive = false;
    let isLocked = false;

    // DOM 요소 캐싱
    const cardGrid = document.getElementById('cardGrid');
    const timerDisplay = document.getElementById('timerDisplay');
    const movesDisplay = document.getElementById('movesDisplay');
    const matchesDisplay = document.getElementById('matchesDisplay');
    const restartBtn = document.getElementById('restartBtn');
    const soundBtn = document.getElementById('soundBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');
    const victoryModal = document.getElementById('victoryModal');
    const modalPlayAgainBtn = document.getElementById('modalPlayAgainBtn');
    const finalTime = document.getElementById('finalTime');
    const finalMoves = document.getElementById('finalMoves');
    const finalRating = document.getElementById('finalRating');

    // Fisher-Yates 셔플 알고리즘
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 새 게임 초기화
    function startNewGame() {
      // 타이머 초기화
      clearInterval(timer);
      timer = null;
      secondsElapsed = 0;
      isGameActive = false;
      isLocked = false;
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;

      updateDisplays();
      closeVictoryModal();
      stopFireworks();

      // 8종류 카드를 2장씩 복제하여 16장 덱 생성 후 셔플
      const deck = shuffleArray([...CARD_ITEMS, ...CARD_ITEMS].map((item, index) => ({
        ...item,
        uniqueId: `${item.id}-${index}`
      })));

      cards = deck;
      renderBoard();
    }

    function renderBoard() {
      cardGrid.innerHTML = '';

      cards.forEach((card, index) => {
        const cardContainer = document.createElement('div');
        cardContainer.className = 'perspective-1000 w-full h-full';

        // 카드 내부 회전 래퍼
        const cardInner = document.createElement('div');
        cardInner.className = 'w-full h-full relative transform-style-3d transition-transform duration-500 cursor-pointer rounded-2xl card-shadow';
        cardInner.dataset.index = index;
        cardInner.setAttribute('role', 'button');
        cardInner.setAttribute('aria-label', `카드 ${index + 1}`);

        // 카드 뒷면 (가려진 상태)
        const cardBack = document.createElement('div');
        cardBack.className = 'absolute inset-0 w-full h-full rounded-2xl backface-hidden bg-gradient-to-br from-indigo-700 via-indigo-800 to-purple-900 border-2 border-indigo-400/30 flex items-center justify-center hover:brightness-110 active:scale-95 transition-all';
        cardBack.innerHTML = `
          <div class="w-8 h-8 rounded-xl bg-indigo-900/60 border border-indigo-400/20 flex items-center justify-center text-indigo-300 font-jua text-sm sm:text-base">
            ?
          </div>
        `;

        // 카드 앞면 (이모지가 보이는 상태)
        const cardFront = document.createElement('div');
        cardFront.className = `absolute inset-0 w-full h-full rounded-2xl backface-hidden rotate-y-180 bg-gradient-to-br ${card.color} border-2 border-white/40 flex flex-col items-center justify-center p-1 shadow-inner`;
        cardFront.innerHTML = `
          <span class="text-3xl sm:text-4xl drop-shadow-md select-none">${card.emoji}</span>
          <span class="text-[10px] sm:text-xs font-bold text-slate-900/80 mt-0.5 tracking-tight">${card.name}</span>
        `;

        cardInner.appendChild(cardBack);
        cardInner.appendChild(cardFront);
        cardContainer.appendChild(cardInner);

        // 클릭 이벤트 핸들러
        cardInner.addEventListener('click', () => handleCardClick(cardInner, index));

        cardGrid.appendChild(cardContainer);
      });
    }

    function handleCardClick(cardElement, index) {
      // 잠겨있거나, 이미 뒤집힌 카드거나, 이미 매치된 경우 무시
      if (isLocked) return;
      if (cardElement.classList.contains('rotate-y-180')) return;

      // 첫 클릭 시 타이머 시작
      if (!isGameActive) {
        startTimer();
      }

      // 카드 뒤집기
      sound.playFlip();
      cardElement.classList.add('rotate-y-180');
      flippedCards.push({ element: cardElement, card: cards[index] });

      // 2장이 뒤집혔을 때 비교
      if (flippedCards.length === 2) {
        moves++;
        movesDisplay.textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      isLocked = true;
      const [first, second] = flippedCards;

      if (first.card.id === second.card.id) {
        // 일치한 경우
        setTimeout(() => {
          sound.playMatch();
          first.element.classList.add('matched-glow', 'match-pop');
          second.element.classList.add('matched-glow', 'match-pop');

          matchedPairs++;
          matchesDisplay.textContent = `${matchedPairs} / 8`;
          flippedCards = [];
          isLocked = false;

          // 모든 카드(8쌍) 맞춘 경우 승리
          if (matchedPairs === 8) {
            handleGameWin();
          }
        }, 300);
      } else {
        // 불일치한 경우
        setTimeout(() => {
          sound.playMismatch();
          first.element.classList.add('shake');
          second.element.classList.add('shake');
        }, 400);

        setTimeout(() => {
          first.element.classList.remove('rotate-y-180', 'shake');
          second.element.classList.remove('rotate-y-180', 'shake');
          flippedCards = [];
          isLocked = false;
        }, 1000);
      }
    }

    function startTimer() {
      isGameActive = true;
      timer = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(secondsElapsed / 60);
      const seconds = secondsElapsed % 60;
      timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function updateDisplays() {
      updateTimerDisplay();
      movesDisplay.textContent = moves;
      matchesDisplay.textContent = `${matchedPairs} / 8`;
    }

    function handleGameWin() {
      clearInterval(timer);
      sound.playVictory();
      startFireworks();

      // 결과 점수 계산 (이동 횟수 기준 별점)
      let rating = '⭐⭐⭐';
      if (moves > 18) rating = '⭐';
      else if (moves > 13) rating = '⭐⭐';

      finalTime.textContent = timerDisplay.textContent;
      finalMoves.textContent = `${moves}회`;
      finalRating.textContent = rating;

      setTimeout(() => {
        victoryModal.classList.remove('opacity-0', 'pointer-events-none');
        victoryModal.querySelector('div').classList.remove('scale-95');
        victoryModal.querySelector('div').classList.add('scale-100');
      }, 500);
    }

    function closeVictoryModal() {
      victoryModal.classList.add('opacity-0', 'pointer-events-none');
      victoryModal.querySelector('div').classList.remove('scale-100');
      victoryModal.querySelector('div').classList.add('scale-95');
    }

    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let animationId = null;
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 8 + 4;
        this.speedX = Math.random() * 6 - 3;
        this.speedY = Math.random() * -6 - 2;
        this.gravity = 0.15;
        this.color = `hsl(${Math.random() * 360}, 90%, 65%)`;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = Math.random() * 10 - 5;
        this.opacity = 1;
      }

      update() {
        this.speedY += this.gravity;
        this.x += this.speedX;
        this.y += this.speedY;
        this.rotation += this.rotationSpeed;
        this.opacity -= 0.007;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    function startFireworks() {
      resizeCanvas();
      canvas.classList.remove('hidden');
      particles = [];

      for (let i = 0; i < 90; i++) {
        particles.push(new Particle(canvas.width / 2, canvas.height * 0.45));
        particles.push(new Particle(canvas.width * 0.25, canvas.height * 0.4));
        particles.push(new Particle(canvas.width * 0.75, canvas.height * 0.4));
      }

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter(p => p.opacity > 0);

        particles.forEach(p => {
          p.update();
          p.draw();
        });

        if (particles.length > 0) {
          animationId = requestAnimationFrame(loop);
        } else {
          stopFireworks();
        }
      }

      loop();
    }

    function stopFireworks() {
      if (animationId) cancelAnimationFrame(animationId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.classList.add('hidden');
    }

    restartBtn.addEventListener('click', () => {
      startNewGame();
    });

    modalPlayAgainBtn.addEventListener('click', () => {
      startNewGame();
    });

    soundBtn.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      if (sound.enabled) {
        soundIcon.textContent = '🔊';
        soundText.textContent = '소리 켜짐';
        sound.playFlip();
      } else {
        soundIcon.textContent = '🔇';
        soundText.textContent = '음소거';
      }
    });

    // 시작 시 게임 초기화
    window.addEventListener('load', () => {
      startNewGame();
    });
  </script>
</body>
</html>
