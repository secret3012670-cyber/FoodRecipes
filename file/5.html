<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>신나는 구구단 팡팡!</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Pretendard:wght@600;800&display=swap');

    * {
      font-family: 'Jua', 'Gaegu', cursive, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      touch-action: manipulation;
    }

    /* 통통 튀는 바운스 애니메이션 */
    @keyframes bounce-pop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .animate-pop {
      animation: bounce-pop 0.35s ease-in-out;
    }

    /* 흔들림 효과 (오답 시) */
    @keyframes wiggle {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-3deg); }
      75% { transform: translateX(8px) rotate(3deg); }
    }
    .animate-wiggle {
      animation: wiggle 0.4s ease-in-out;
    }

    /* 젤리 버튼 클릭감 */
    .jelly-btn {
      transition: all 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .jelly-btn:active {
      transform: scale(0.92) translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.15) !important;
    }

    /* 부드러운 그림자 */
    .soft-shadow {
      box-shadow: 0 8px 20px -4px rgba(249, 115, 22, 0.18);
    }
  </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 selection:bg-amber-200">

  <!-- 메인 게임 컨테이너 -->
  <div class="w-full max-w-md flex flex-col flex-1 justify-between gap-2">

    <!-- ==================== [1. 상단 네비게이션 & 정보바] ==================== -->
    <header class="flex items-center justify-between px-3 py-2 bg-white/90 backdrop-blur rounded-3xl border-2 border-amber-200 shadow-sm">
      <div class="flex items-center gap-1.5">
        <button id="btn-home" class="jelly-btn w-9 h-9 rounded-2xl bg-amber-100 hover:bg-amber-200 text-amber-800 flex items-center justify-center text-lg shadow">
          🏠
        </button>
        <span id="header-title" class="text-base sm:text-lg font-bold text-amber-900 tracking-wide ml-1">
          신나는 구구단 팡팡!
        </span>
      </div>

      <div class="flex items-center gap-2">
        <!-- 별 카운터 -->
        <div class="flex items-center gap-1 bg-amber-100 px-3 py-1 rounded-2xl text-amber-700 font-extrabold text-sm shadow-inner">
          <span>⭐</span>
          <span id="star-count">0</span>
        </div>
        <!-- 소리 온/오프 -->
        <button id="btn-sound" class="jelly-btn w-9 h-9 rounded-2xl bg-amber-100 hover:bg-amber-200 text-amber-800 flex items-center justify-center text-base shadow">
          🔔
        </button>
      </div>
    </header>

    <!-- ==================== [2. 화면 A : 메인 메뉴 (단수 선택 화면)] ==================== -->
    <section id="screen-menu" class="flex flex-col flex-1 justify-between gap-3 py-1">
      
      <!-- 귀여운 배너 캐릭터 -->
      <div class="bg-gradient-to-br from-amber-200 via-orange-100 to-pink-100 rounded-3xl p-4 border-2 border-orange-200 text-center relative overflow-hidden shadow-sm">
        <div class="text-4xl sm:text-5xl animate-bounce">🐻🎒</div>
        <h2 class="text-xl sm:text-2xl font-black text-amber-950 mt-1">몇 단을 연습해볼까요?</h2>
        <p class="text-xs sm:text-sm text-amber-800 font-medium mt-0.5">자신 있는 단을 누르거나 코스를 골라봐요!</p>
        
        <button id="btn-open-table" class="jelly-btn mt-2.5 inline-flex items-center gap-1 bg-white/95 text-amber-800 border-2 border-amber-300 px-3.5 py-1.5 rounded-full text-xs font-bold shadow hover:bg-amber-50">
          📖 구구단 표 전체 보기
        </button>
      </div>

      <!-- 추천 코스 (저학년 맞춤) -->
      <div class="flex flex-col gap-1.5">
        <span class="text-xs font-bold text-amber-900 px-2 flex items-center gap-1">
          🌱 초보자 추천 코스
        </span>
        <div class="grid grid-cols-2 gap-2">
          <button class="course-btn jelly-btn bg-emerald-100 hover:bg-emerald-200 border-2 border-emerald-300 p-2.5 rounded-2xl text-left shadow-sm flex items-center gap-2.5" data-mode="course-easy">
            <span class="text-2xl bg-white p-1.5 rounded-xl shadow-inner">🐣</span>
            <div>
              <div class="text-emerald-900 font-extrabold text-sm">기초 코스</div>
              <div class="text-[11px] text-emerald-700">제일 쉬운 2단 · 5단</div>
            </div>
          </button>

          <button class="course-btn jelly-btn bg-sky-100 hover:bg-sky-200 border-2 border-sky-300 p-2.5 rounded-2xl text-left shadow-sm flex items-center gap-2.5" data-mode="course-mid">
            <span class="text-2xl bg-white p-1.5 rounded-xl shadow-inner">🐰</span>
            <div>
              <div class="text-sky-900 font-extrabold text-sm">초급 코스</div>
              <div class="text-[11px] text-sky-700">익숙해지는 3단 · 4단</div>
            </div>

      </div>

      <!-- 개별 단수 선택 (2단 ~ 9단) -->
      <div class="flex flex-col gap-1.5">
        <span class="text-xs font-bold text-amber-900 px-2 flex items-center gap-1">
          🔢 한 단씩 마스터하기
        </span>
        <div class="grid grid-cols-4 gap-2">
          <!-- 2단 ~ 9단 버튼들 -->
          <button class="dan-btn jelly-btn bg-rose-100 border-2 border-rose-300 text-rose-900 py-3 rounded-2xl font-extrabold text-base flex flex-col items-center shadow-sm hover:bg-rose-200" data-dan="2">

            <span class="text-[10px] text-rose-600 font-normal">사탕 2개씩</span>

          <button class="dan-btn jelly-btn bg-orange-100 border-2 border-orange-300 text-orange-900 py-3 rounded-2xl font-extrabold text-base flex flex-col items-center shadow-sm hover:bg-orange-200" data-dan="3">
            <span>3단</span>

          <button class="dan-btn jelly-btn bg-amber-100 border-2 border-amber-300 text-amber-900 py-3 rounded-2xl font-extrabold text-base flex flex-col items-center shadow-sm hover:bg-amber-200" data-dan="4">
            <span>4단</span>
            <span class="text-[10px] text-amber-600 font-normal">자동차 바퀴</span>
          </button>
          <button class="dan-btn jelly-btn bg-emerald-100 border-2 border-emerald-300 text-emerald-900 py-3 rounded-2xl font-extrabold text-base flex flex-col items-center shadow-sm hover:bg-emerald-200" data-dan="5">
            <span>5단</span>
            <span class="text-[10px] text-emerald-600 font-normal">손가락 5개</span>
          </button>
          <button class="dan-btn jelly-btn bg-teal-100 border-2 border-teal-300 text-teal-900 py-3 rounded-2xl font-extrabold text-base flex flex-col items-center shadow-sm hover:bg-teal-200" data-dan="6">
            <span>6단</span>
            <span class="text-[10px] text-teal-600 font-normal">벌집 모양</span>
          </button>
          <button class="dan-btn jelly-btn bg-sky-100 border-2 border-sky-300 text-sky-900 py-3 rounded-2xl font-extrabold text-base flex flex-col items-center shadow-sm hover:bg-sky-200" data-dan="7">
            <span>7단</span>
            <span class="text-[10px] text-sky-600 font-normal">무지개 7색</span>
          </button>
          <button class="dan-btn jelly-btn bg-indigo-100 border-2 border-indigo-300 text-indigo-900 py-3 rounded-2xl font-extrabold text-base flex flex-col items-center shadow-sm hover:bg-indigo-200" data-dan="8">
            <span>8단</span>
            <span class="text-[10px] text-indigo-600 font-normal">문어 다리</span>
          </button>
          <button class="dan-btn jelly-btn bg-purple-100 border-2 border-purple-300 text-purple-900 py-3 rounded-2xl font-extrabold text-base flex flex-col items-center shadow-sm hover:bg-purple-200" data-dan="9">
            <span>9단</span>
            <span class="text-[10px] text-purple-600 font-normal">도전 챔피언</span>

      <!-- 종합 퀴즈 버튼 -->
      <button class="course-btn jelly-btn w-full bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 text-white font-black py-3.5 rounded-2xl text-base sm:text-lg shadow-md hover:brightness-105 flex items-center justify-center gap-2 border-2 border-white/60" data-mode="random-all">
        <span>🏆 전단 섞어서 10문제 도전!</span>
      </button>

    <!-- ==================== [3. 화면 B : 게임 플레이 화면] ==================== -->
    <section id="screen-game" class="hidden flex-col flex-1 justify-between gap-3 py-1">
      
      <!-- 상단 진행도 & 콤보 -->
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-1.5">
          <span id="game-stage-tag" class="bg-amber-200 text-amber-900 text-xs px-2.5 py-1 rounded-xl font-bold">
            3단 연습
          </span>
          <span class="text-xs text-amber-800 font-bold">
            문제 <span id="current-q-num" class="text-amber-600 text-sm">1</span> / 10
          </span>
        </div>

        <!-- 콤보 배지 -->
        <div id="combo-badge" class="hidden items-center gap-1 bg-gradient-to-r from-orange-500 to-amber-500 text-white text-xs px-3 py-1 rounded-full font-black animate-pulse shadow">
          <span>🔥</span> <span id="combo-text">2 콤보!</span>
        </div>
      </div>

      <!-- 문제 진행 게이지 바 -->
      <div class="w-full bg-amber-100 h-3 rounded-full overflow-hidden border border-amber-300/60 p-0.5">
        <div id="progress-bar" class="bg-gradient-to-r from-amber-400 to-orange-500 h-full rounded-full transition-all duration-300" style="width: 10%;"></div>

      <!-- 문제 제시 메인 카드 -->
      <div class="relative bg-white rounded-3xl border-4 border-amber-300 p-5 sm:p-6 text-center shadow-lg flex flex-col items-center justify-center min-h-[170px] sm:min-h-[190px]">
        <!-- 힌트 버튼 -->
        <button id="btn-hint" class="jelly-btn absolute top-3 right-3 bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-xl border border-amber-300 flex items-center gap-1 shadow-sm">
          <span>💡 힌트 보기</span>
        </button>

        <!-- 귀여운 도우미 캐릭터 -->
        <div id="quiz-mascot" class="text-3xl sm:text-4xl mb-1 select-none">
          🐱
        </div>

        <!-- 곱셈 식 -->
        <div id="quiz-question" class="text-4xl sm:text-5xl font-black text-amber-950 tracking-wider flex items-center gap-2">
          <span>3</span>
          <span class="text-orange-500 text-3xl sm:text-4xl">×</span>
          <span>4</span>
          <span class="text-amber-400 text-3xl sm:text-4xl">=</span>
          <span class="text-amber-400 bg-amber-100 px-3 py-0.5 rounded-2xl border-2 border-dashed border-amber-300">?</span>
        </div>

        <!-- 칭찬 & 피드백 메시지 박스 -->

          참 잘했어요! 💖
        </div>
      </div>

      <!-- 시각 힌트 팝업 영역 (묶음 세기 그림) -->
      <div id="hint-box" class="hidden bg-orange-50 rounded-2xl border-2 border-orange-200 p-2.5 flex flex-col items-center text-center">
        <span id="hint-desc" class="text-xs text-orange-900 font-bold mb-1">
          사과가 3개씩 4묶음 있어요!
        </span>
        <div id="hint-items" class="flex flex-wrap justify-center gap-1 max-h-24 overflow-y-auto p-1 bg-white rounded-xl w-full border border-orange-200">
          <!-- 과일 이모지가 묶음별로 렌더링됩니다 -->
        </div>
      </div>

      <!-- 4지선다 답안 버튼 그리드 -->
      <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
        <button class="choice-btn jelly-btn bg-white hover:bg-amber-50 border-4 border-amber-200 active:border-amber-400 text-amber-950 font-black text-2xl sm:text-3xl py-4 sm:py-5 rounded-3xl shadow-md flex items-center justify-center">
          12
        </button>
        <button class="choice-btn jelly-btn bg-white hover:bg-amber-50 border-4 border-amber-200 active:border-amber-400 text-amber-950 font-black text-2xl sm:text-3xl py-4 sm:py-5 rounded-3xl shadow-md flex items-center justify-center">
          15
        </button>
        <button class="choice-btn jelly-btn bg-white hover:bg-amber-50 border-4 border-amber-200 active:border-amber-400 text-amber-950 font-black text-2xl sm:text-3xl py-4 sm:py-5 rounded-3xl shadow-md flex items-center justify-center">
          9
        </button>
        <button class="choice-btn jelly-btn bg-white hover:bg-amber-50 border-4 border-amber-200 active:border-amber-400 text-amber-950 font-black text-2xl sm:text-3xl py-4 sm:py-5 rounded-3xl shadow-md flex items-center justify-center">
          18
        </button>
      </div>
    </section>

    <!-- ==================== [4. 화면 C : 결과 리포트 화면] ==================== -->
    <section id="screen-result" class="hidden flex-col flex-1 justify-between gap-3 py-2 items-center text-center">
      <div class="w-full bg-white rounded-3xl border-4 border-amber-300 p-6 shadow-xl flex flex-col items-center gap-3">
        <!-- 메달 / 트로피 아이콘 -->
        <div id="result-medal" class="w-20 h-20 rounded-full bg-amber-100 border-4 border-amber-300 flex items-center justify-center text-5xl animate-pop shadow">
          👑
        </div>

        <div>
          <h3 id="result-title" class="text-2xl sm:text-3xl font-black text-amber-950">
            구구단 마스터 탄생!
          </h3>
          <p id="result-subtitle" class="text-xs sm:text-sm text-amber-700 mt-0.5">
            정말 멋져요! 실력이 쑥쑥 자랐어요.
          </p>
        </div>

        <!-- 점수 카드 -->
        <div class="w-full bg-amber-50 rounded-2xl p-3 border-2 border-amber-200 flex justify-around items-center my-1">
          <div>
            <div class="text-[11px] text-amber-700 font-bold">맞힌 문제</div>
            <div class="text-xl sm:text-2xl font-black text-emerald-600">
              <span id="final-correct">10</span> / 10
            </div>
          </div>
          <div class="h-8 w-0.5 bg-amber-200"></div>
          <div>
            <div class="text-[11px] text-amber-700 font-bold">새로 모은 별</div>
            <div class="text-xl sm:text-2xl font-black text-amber-500 flex items-center justify-center gap-1">
              <span>⭐</span>
              <span id="final-stars">+10</span>
            </div>
          </div>
        </div>

        <!-- 칭찬 도장 -->
        <div class="px-4 py-1.5 bg-rose-100 text-rose-700 border-2 border-rose-300 rounded-2xl font-extrabold text-sm rotate-[-2deg] shadow-sm">
          💮 칭찬 스티커 쾅쾅!
        </div>
      </div>

      <!-- 액션 버튼 -->
      <div class="flex flex-col w-full gap-2">
        <button id="btn-replay" class="jelly-btn w-full py-3.5 bg-gradient-to-r from-amber-400 to-orange-400 text-white text-base sm:text-lg font-black rounded-2xl shadow-lg border-2 border-white/60 flex items-center justify-center gap-1.5">
          🔄 다시 한 번 더 풀기!
        </button>
        <button id="btn-other-dan" class="jelly-btn w-full py-3 bg-white hover:bg-amber-50 text-amber-900 border-2 border-amber-300 text-sm sm:text-base font-extrabold rounded-2xl shadow">
          📋 다른 단 도전하기
        </button>
      </div>
    </section>

  </div>

  <!-- ==================== [구구단 표 모달 팝업] ==================== -->
  <div id="table-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-3 z-50">
    <div class="bg-white rounded-3xl border-4 border-amber-300 w-full max-w-md max-h-[85vh] flex flex-col p-4 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b-2 border-amber-200">
        <h3 class="text-lg font-black text-amber-900 flex items-center gap-1.5">
          <span>📖</span> 한눈에 쏙 구구단 표
        </h3>
        <button id="btn-close-table" class="jelly-btn w-8 h-8 rounded-full bg-amber-100 text-amber-800 font-black flex items-center justify-center">
          ✕
        </button>
      </div>

      <!-- 2단부터 9단까지 격자 배치 -->
      <div class="grid grid-cols-2 gap-2 overflow-y-auto py-3 pr-1 text-xs">
        <!-- JS로 채워짐 -->
      </div>
    </div>
  </div>

  <!-- 파티클 효과용 캔버스 (클리어 시 컨페티 효과) -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-40"></canvas>

  <script>
    /* ==========================================================================
       1. 사운드 시스템 (Web Audio API - 자체 실로폰 & 팡파레 멜로디)
       ========================================================================== */
    class KidSound {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.12, vol = 0.2) {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      // 버튼 클릭 '톡' 소리
      click() {
        this.playTone(600, 'triangle', 0.05, 0.1);
      }

      // 정답 실로폰 딩동댕 (도 - 미 - 솔 - 높은도)
      correct() {
        if (this.muted) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'sine', 0.18, 0.25), i * 70);
        });
      }

      // 오답 부드러운 띠로리 소리 (솔 -> 파 -> 미)
      wrong() {
        if (this.muted) return;
        const notes = [392.00, 349.23];
        notes.forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'triangle', 0.18, 0.2), i * 90);
        });
      }

      // 클리어 팡파레
      fanfare() {
        if (this.muted) return;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'triangle', 0.25, 0.3), i * 90);
        });
      }
    }

    const sound = new KidSound();

    /* ==========================================================================
       2. 문제 생성 및 퀴즈 엔진
       ========================================================================== */
    const PRAISE_MESSAGES = [
      "참 잘했어요! 👍", "와, 대단해요! ✨", "완벽해요! 💯",
      "멋져요! 최고! 🌟", "구구단 천재인가요? 🚀", "정답이에요! 💖"
    ];

    const MASCOTS = ["🐻", "🐰", "🐱", "🐶", "🦊", "🐼", "🐸", "🦁"];
    const FRUITS = ["🍎", "🍓", "🍊", "🍇", "🍒", "⭐", "🥕", "🍪"];

    let currentMode = 'dan'; // 'dan', 'course-easy', 'course-mid', 'random-all'
    let selectedDan = 2;
    let questions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let combo = 0;
    let totalStars = 0;
    let isAnswering = false;

    // 문제 10개 생성기
    function generateQuestions() {
      const qList = [];
      
      for (let i = 0; i < 10; i++) {
        let dan, num;

        if (currentMode === 'dan') {
          dan = selectedDan;
          num = Math.floor(Math.random() * 9) + 1; // 1~9
        } else if (currentMode === 'course-easy') {
          dan = Math.random() < 0.5 ? 2 : 5;
          num = Math.floor(Math.random() * 9) + 1;
        } else if (currentMode === 'course-mid') {
          dan = Math.random() < 0.5 ? 3 : 4;
          num = Math.floor(Math.random() * 9) + 1;
        } else {
          // 전단 랜덤
          dan = Math.floor(Math.random() * 8) + 2; // 2~9단
          num = Math.floor(Math.random() * 9) + 1;
        }

        const answer = dan * num;

        // 매력적인 4지선다 오답 보기 생성 (비슷한 값들로 저학년 눈높이 맞춤)
        const choices = new Set([answer]);
        while (choices.size < 4) {
          const delta = (Math.floor(Math.random() * 5) - 2) * dan; // ±1단수 or ±2단수
          const randOffset = Math.floor(Math.random() * 7) - 3;
          let wrong = answer + (delta !== 0 ? delta : randOffset);
          if (wrong <= 0 || wrong === answer) {
            wrong = answer + choices.size * 2 + 1;
          }
          choices.add(wrong);
        }

        // 보기 셔플
        const shuffledChoices = Array.from(choices).sort(() => Math.random() - 0.5);

        qList.push({
          dan,
          num,
          answer,
          choices: shuffledChoices
        });
      }

      return qList;
    }

    /* ==========================================================================
       3. 화면 전환 및 렌더링
       ========================================================================== */
    const screenMenu = document.getElementById('screen-menu');
    const screenGame = document.getElementById('screen-game');
    const screenResult = document.getElementById('screen-result');

    const headerTitle = document.getElementById('header-title');
    const starCountEl = document.getElementById('star-count');
    const gameStageTag = document.getElementById('game-stage-tag');
    const currentQNumEl = document.getElementById('current-q-num');
    const progressBar = document.getElementById('progress-bar');
    const comboBadge = document.getElementById('combo-badge');
    const comboText = document.getElementById('combo-text');
    const quizMascot = document.getElementById('quiz-mascot');
    const quizQuestion = document.getElementById('quiz-question');
    const feedbackMsg = document.getElementById('feedback-msg');
    const hintBox = document.getElementById('hint-box');
    const hintDesc = document.getElementById('hint-desc');
    const hintItems = document.getElementById('hint-items');
    const choiceButtons = document.querySelectorAll('.choice-btn');

    function showScreen(screen) {
      screenMenu.classList.add('hidden');
      screenGame.classList.add('hidden');
      screenResult.classList.add('hidden');
      screen.classList.remove('hidden');
    }

    function startGame(mode, dan = 2) {
      currentMode = mode;
      selectedDan = dan;
      currentIndex = 0;
      correctCount = 0;
      combo = 0;
      isAnswering = false;

      // 상단 타이틀 세팅
      if (mode === 'dan') {
        headerTitle.innerText = `${dan}단 탐험`;
        gameStageTag.innerText = `${dan}단 연습`;
      } else if (mode === 'course-easy') {
        headerTitle.innerText = `기초 코스 (2·5단)`;
        gameStageTag.innerText = `2단 · 5단`;
      } else if (mode === 'course-mid') {
        headerTitle.innerText = `초급 코스 (3·4단)`;
        gameStageTag.innerText = `3단 · 4단`;
      } else {
        headerTitle.innerText = `종합 퀴즈 도전`;
        gameStageTag.innerText = `2~9단 랜덤`;
      }

      comboBadge.classList.add('hidden');
      hintBox.classList.add('hidden');
      feedbackMsg.style.opacity = '0';

      questions = generateQuestions();
      showScreen(screenGame);
      loadQuestion();
    }

    function loadQuestion() {
      if (currentIndex >= questions.length) {
        finishGame();
        return;
      }

      isAnswering = false;
      hintBox.classList.add('hidden');
      feedbackMsg.style.opacity = '0';

      const q = questions[currentIndex];
      currentQNumEl.innerText = currentIndex + 1;
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

      // 무작위 귀여운 캐릭터 표시
      quizMascot.innerText = MASCOTS[Math.floor(Math.random() * MASCOTS.length)];

      // 문제 식 렌더링
      quizQuestion.innerHTML = `
        <span>${q.dan}</span>
        <span class="text-orange-500 text-3xl sm:text-4xl">×</span>
        <span>${q.num}</span>
        <span class="text-amber-400 text-3xl sm:text-4xl">=</span>
        <span class="text-amber-400 bg-amber-100 px-3 py-0.5 rounded-2xl border-2 border-dashed border-amber-300">?</span>
      `;

      // 4지선다 보기 채우기
      choiceButtons.forEach((btn, idx) => {
        btn.innerText = q.choices[idx];
        btn.disabled = false;
        btn.className = "choice-btn jelly-btn bg-white hover:bg-amber-50 border-4 border-amber-200 active:border-amber-400 text-amber-950 font-black text-2xl sm:text-3xl py-4 sm:py-5 rounded-3xl shadow-md flex items-center justify-center";
      });
    }

    // 힌트 열기/닫기 토글 (묶음 사탕 그림)
    function toggleHint() {
      if (isAnswering) return;
      sound.click();

      if (!hintBox.classList.contains('hidden')) {
        hintBox.classList.add('hidden');
        return;
      }

      const q = questions[currentIndex];
      const fruit = FRUITS[Math.floor(Math.random() * FRUITS.length)];
      hintDesc.innerText = `${fruit}이(가) ${q.dan}개씩 ${q.num}묶음 있어요!`;

      // 묶음별로 박스를 만들어 직관적으로 보여주기
      hintItems.innerHTML = '';
      for (let b = 1; b <= q.num; b++) {
        const bundleDiv = document.createElement('div');
        bundleDiv.className = "flex items-center gap-0.5 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200 text-sm";
        let str = '';
        for (let k = 0; k < q.dan; k++) str += fruit;
        bundleDiv.innerText = str;
        hintItems.appendChild(bundleDiv);
      }

      hintBox.classList.remove('hidden');
    }

    // 답안 선택 처리
    function handleChoice(selectedVal, targetBtn) {
      if (isAnswering) return;
      isAnswering = true;

      const q = questions[currentIndex];
      const isCorrect = (selectedVal === q.answer);

      if (isCorrect) {
        sound.correct();
        correctCount++;
        combo++;
        totalStars += (combo >= 3 ? 2 : 1);
        starCountEl.innerText = totalStars;

        // 정답 버튼 초록색 강조 + 바운스
        targetBtn.className = "choice-btn bg-emerald-400 text-white border-4 border-emerald-500 font-black text-2xl sm:text-3xl py-4 sm:py-5 rounded-3xl shadow-lg flex items-center justify-center animate-pop";
        
        // 칭찬 피드백
        const praise = PRAISE_MESSAGES[Math.floor(Math.random() * PRAISE_MESSAGES.length)];
        feedbackMsg.innerText = praise;
        feedbackMsg.className = "h-6 mt-2 text-sm font-black text-emerald-600 transition-all opacity-100 animate-pop";

        // 콤보 배지
        if (combo >= 2) {
          comboText.innerText = `${combo} 콤보! 🔥`;
          comboBadge.classList.remove('hidden');
        }

        setTimeout(() => {
          currentIndex++;
          loadQuestion();
        }, 850);

      } else {
        sound.wrong();
        combo = 0;
        comboBadge.classList.add('hidden');

        // 오답 버튼 빨간색 강조 + 흔들림
        targetBtn.className = "choice-btn bg-rose-300 text-rose-900 border-4 border-rose-400 font-black text-2xl sm:text-3xl py-4 sm:py-5 rounded-3xl shadow-md flex items-center justify-center animate-wiggle";
        
        feedbackMsg.innerText = `아쉬워요! 정답은 ${q.answer} 예요 💪`;
        feedbackMsg.className = "h-6 mt-2 text-sm font-black text-rose-500 transition-all opacity-100";

        // 올바른 정답 버튼도 알려주기
        choiceButtons.forEach(btn => {
          if (parseInt(btn.innerText, 10) === q.answer) {
            btn.classList.remove('bg-white', 'border-amber-200');
            btn.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-900');
          }
        });

        setTimeout(() => {
          currentIndex++;
          loadQuestion();
        }, 1200);
      }
    }

    // 게임 완료 결과창
    function finishGame() {
      sound.fanfare();
      triggerConfetti();

      document.getElementById('final-correct').innerText = correctCount;
      document.getElementById('final-stars').innerText = `+${correctCount}`;

      const titleEl = document.getElementById('result-title');
      const subEl = document.getElementById('result-subtitle');
      const medalEl = document.getElementById('result-medal');

      if (correctCount === 10) {
        medalEl.innerText = "👑";
        titleEl.innerText = "완벽한 만점! 구구단 챔피언!";
        subEl.innerText = "10문제를 모두 맞혔어요! 천재가 틀림없어요!";
      } else if (correctCount >= 7) {
        medalEl.innerText = "🥇";
        titleEl.innerText = "참 잘했어요! 멋져요!";
        subEl.innerText = "조금만 더 연습하면 곧 만점도 가능해요!";
      } else {
        medalEl.innerText = "🌱";
        titleEl.innerText = "좋은 도전이었어요!";
        subEl.innerText = "구구단 표를 보면서 한 번 더 연습해봐요!";
      }

      showScreen(screenResult);
    }

    /* ==========================================================================
       4. 구구단 표 생성
       ========================================================================== */
    function buildTableModal() {
      const container = document.querySelector('#table-modal .grid');
      container.innerHTML = '';

      for (let dan = 2; dan <= 9; dan++) {
        const box = document.createElement('div');
        box.className = "bg-amber-50/80 p-2.5 rounded-2xl border border-amber-200 shadow-sm flex flex-col gap-1";

        let lines = `<div class="font-extrabold text-amber-900 border-b border-amber-200 pb-1 text-center font-mono">${dan}단</div>`;
        lines += `<div class="text-[11px] text-amber-800 leading-snug font-mono text-center flex flex-col gap-0.5">`;
        for (let i = 1; i <= 9; i++) {
          lines += `<div>${dan} × ${i} = <b class="text-orange-600">${dan * i}</b></div>`;
        }
        lines += `</div>`;
        box.innerHTML = lines;
        container.appendChild(box);
      }
    }

    /* ==========================================================================
       5. 클리어 축하 파티클 (Canvas Confetti)
       ========================================================================== */
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiList = [];
    let confettiTimer = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
      confettiList = [];
      const colors = ['#f43f5e', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6', '#ec4899'];
      for (let i = 0; i < 90; i++) {
        confettiList.push({
          x: canvas.width / 2,
          y: canvas.height / 3,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 8 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10
        });
      }

      if (confettiTimer) cancelAnimationFrame(confettiTimer);
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;

      confettiList.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35; // 중력
        p.rotation += p.rotSpeed;

        if (p.y < canvas.height) alive = true;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
        ctx.restore();
      });

      if (alive) {
        confettiTimer = requestAnimationFrame(animateConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    /* ==========================================================================
       6. 이벤트 바인딩
       ========================================================================== */
    // 단수 선택 버튼들
    document.querySelectorAll('.dan-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sound.click();
        const dan = parseInt(btn.getAttribute('data-dan'), 10);
        startGame('dan', dan);
      });
    });

    // 추천 코스 및 종합 퀴즈 버튼
    document.querySelectorAll('.course-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sound.click();
        const mode = btn.getAttribute('data-mode');
        startGame(mode);
      });
    });

    // 4지선다 버튼 클릭
    choiceButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.innerText, 10);
        handleChoice(val, btn);
      });
    });

    // 힌트 버튼
    document.getElementById('btn-hint').addEventListener('click', toggleHint);

    // 홈 버튼
    document.getElementById('btn-home').addEventListener('click', () => {
      sound.click();
      headerTitle.innerText = "신나는 구구단 팡팡!";
      showScreen(screenMenu);
    });

    // 결과 화면 액션
    document.getElementById('btn-replay').addEventListener('click', () => {
      sound.click();
      startGame(currentMode, selectedDan);
    });

    document.getElementById('btn-other-dan').addEventListener('click', () => {
      sound.click();
      headerTitle.innerText = "신나는 구구단 팡팡!";
      showScreen(screenMenu);
    });

    // 구구단 표 모달 열기/닫기
    const tableModal = document.getElementById('table-modal');
    document.getElementById('btn-open-table').addEventListener('click', () => {
      sound.click();
      buildTableModal();
      tableModal.classList.remove('hidden');
      tableModal.classList.add('flex');
    });

    document.getElementById('btn-close-table').addEventListener('click', () => {
      sound.click();
      tableModal.classList.add('hidden');
      tableModal.classList.remove('flex');
    });

    // 소리 켜기/끄기
    const soundBtn = document.getElementById('btn-sound');
    soundBtn.addEventListener('click', () => {
      sound.muted = !sound.muted;
      soundBtn.innerText = sound.muted ? '🔇' : '🔔';
    });
  </script>
</body>
</html>
