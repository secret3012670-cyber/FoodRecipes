<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>클래식 졸라맨 검객</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');

    body {
      margin: 0;
      overflow: hidden;
      background-color: #f8fafc;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Jua', 'Gowun Dodum', sans-serif;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
    }

    #game-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(90deg, transparent 79px, #abced4 79px, #abced4 81px, transparent 81px),
        linear-gradient(#eee .1em, transparent .1em);
      background-size: 100% 1.2em;
      opacity: 0.5;
      pointer-events: none;
    }

    canvas {
      display: block;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      background-color: #ffffff;
      border: 4px solid #111; 
      border-radius: 8px;
      max-width: 100%;
      max-height: 100%;
      cursor: crosshair;
      position: relative;
      z-index: 10;
    }

    .ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px 20px;
      z-index: 20;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 50;
      transition: opacity 0.3s;
    }

    .btn {
      pointer-events: auto;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.95);
    }

    #weapon-ui {
      background: #fff;
      border: 3px solid #111;
      border-radius: 8px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 4px 4px 0 #111;
      pointer-events: auto;
    }
    
    /* 생명력 하트 스타일 */
    .heart {
      font-size: 24px;
      color: #ef4444;
      text-shadow: 2px 2px 0 #111, -1px -1px 0 #111, 1px -1px 0 #111, -1px 1px 0 #111, 1px 1px 0 #111;
      transition: all 0.3s;
    }
    .heart.empty {
      color: #cbd5e1;
      transform: scale(0.8);
      filter: grayscale(100%);
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <div class="ui-layer">
    <div class="flex justify-between items-start w-full max-w-[800px] mx-auto">
      <div class="flex flex-col gap-2 w-full max-w-[250px]">
        <div class="flex items-end gap-3 drop-shadow-sm">
          <span class="text-rose-600 font-black text-4xl" id="levelDisplay" style="-webkit-text-stroke: 1.5px #111;">LV.1</span>
          <span class="text-slate-800 font-bold text-2xl pb-1">처치: <span id="scoreDisplay">0</span></span>
        </div>
        
        <div class="w-full bg-white rounded-full h-4 border-2 border-slate-800 overflow-hidden relative shadow-[2px_2px_0_#111]">
          <div id="levelProgress" class="bg-rose-500 h-full transition-all duration-300" style="width: 0%"></div>
          <div class="absolute inset-0 flex items-center justify-center text-[11px] text-white font-bold tracking-widest" style="text-shadow: 1px 1px 0 #111, -1px -1px 0 #111, 1px -1px 0 #111, -1px 1px 0 #111;">
            NEXT: <span id="killsToNextLevel">30</span>
          </div>
        </div>

        <div id="weapon-ui" class="mt-2 w-max">
          <span class="text-xs text-slate-500 font-bold">무기</span>
          <span id="weaponName" class="text-xl font-bold text-slate-800">기본 검</span>
        </div>
      </div>
      
      <div class="flex flex-col items-end gap-2 pointer-events-auto">
        <button id="soundToggle" class="btn text-2xl bg-white p-2.5 rounded-xl border-2 border-slate-800 shadow-[2px_2px_0_#111]">
          🔊
        </button>
        <!-- 생명력 하트 표시 컨테이너 -->
        <div id="health-container" class="flex gap-1 bg-white px-3 py-1 rounded-xl border-2 border-slate-800 shadow-[2px_2px_0_#111] mt-2">
          <span class="heart" id="heart-1">❤️</span>
          <span class="heart" id="heart-2">❤️</span>
          <span class="heart" id="heart-3">❤️</span>
        </div>
      </div>
    </div>

    <div class="absolute bottom-[8%] w-full flex justify-center opacity-50 pointer-events-none md:hidden">
      <div class="text-slate-800 border-2 border-dashed border-slate-800 bg-white px-6 py-3 rounded-full text-center flex items-center gap-2 shadow-sm">
        <div class="text-2xl animate-pulse">👆</div>
        <div class="font-bold text-base text-left leading-tight">화면 터치로 공격</div>
      </div>
    </div>
  </div>

  <div id="startScreen" class="overlay">
    <h1 class="text-6xl md:text-8xl font-black text-slate-900 mb-2 text-center" style="-webkit-text-stroke: 2px #111; color: white; text-shadow: 4px 4px 0 #111;">
      졸라맨 검객
    </h1>
    <p class="text-slate-800 mb-6 text-xl font-bold">적을 베어내고 레벨을 올리세요!</p>
    
    <div class="mb-8 text-slate-800 bg-white p-5 rounded-xl border-4 border-slate-900 shadow-[6px_6px_0_#111] text-center">
      <span class="block text-rose-600 font-black text-2xl mb-2">⚔️ 공격 (ATTACK) ⚔️</span>
      <b>Space 바</b> / <b>마우스 클릭</b> / <b>화면 터치</b><br>
      <span class="text-slate-500 text-sm mt-3 block font-bold">* 바닥에 떨어진 무기에 닿으면 자동 장착!</span>
    </div>

    <button id="startBtn" class="btn bg-rose-500 text-white font-black text-2xl py-3 px-12 rounded-xl border-4 border-slate-900 shadow-[4px_4px_0_#111] hover:bg-rose-400">
      전투 시작
    </button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h2 class="text-6xl md:text-8xl font-black text-rose-600 mb-3 text-center" style="text-shadow: 4px 4px 0 #111;">
      으악!
    </h2>
    
    <div class="bg-white p-6 rounded-xl border-4 border-slate-900 shadow-[6px_6px_0_#111] text-center mb-8 min-w-[280px]">
      <div class="text-slate-600 text-xl font-bold mb-1">도달 레벨: <span id="finalLevel" class="text-rose-500">LV.1</span></div>
      <div class="text-5xl font-black text-slate-900 mb-5"><span id="finalScore">0</span> 명 처치</div>
      
      <div class="text-slate-500 text-sm font-bold mb-1">최고 기록</div>
      <div id="bestScore" class="text-2xl font-black text-indigo-600">0</div>
    </div>

    <button id="restartBtn" class="btn bg-slate-900 text-white font-black text-2xl py-4 px-12 rounded-xl border-4 border-slate-900 shadow-[4px_4px_0_#111] hover:bg-slate-700">
      다시 도전하기
    </button>
  </div>
</div>

<script>
/* ==========================================================================
   1. 무기 데이터 사전
   ========================================================================== */
const WEAPONS = {
  BASIC:  { id: 'BASIC',  name: '나뭇가지', color: '#8B4513', effect: '#D2B48C', range: 110, duration: 16, hitPause: 2 },
  DAGGER: { id: 'DAGGER', name: '쌍칼',     color: '#eab308', effect: '#facc15', range: 85,  duration: 8,  hitPause: 1 },
  SPEAR:  { id: 'SPEAR',  name: '긴창',     color: '#3b82f6', effect: '#93c5fd', range: 180, duration: 20, hitPause: 3 },
  AXE:    { id: 'AXE',    name: '도끼',     color: '#ef4444', effect: '#fca5a5', range: 130, duration: 26, hitPause: 6 }
};
const WEAPON_KEYS = Object.keys(WEAPONS);

const LEVEL_COLORS = ['#334155', '#2563eb', '#059669', '#d97706', '#dc2626', '#7c3aed', '#000000'];
const KILLS_PER_LEVEL = 30;
const MAX_HEALTH = 3;

/* ==========================================================================
   2. 사운드 엔진
   ========================================================================== */
class SoundManager {
  constructor() { this.ctx = null; this.muted = false; }
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  playTone(freq, type, duration, vol) {
    if (this.muted) return;
    this.init();
    try {
      const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }
  slash(weaponId) { 
    if (weaponId === 'DAGGER') this.playTone(1200, 'triangle', 0.05, 0.08); 
    else if (weaponId === 'AXE') this.playTone(300, 'sawtooth', 0.15, 0.15); 
    else this.playTone(800, 'triangle', 0.1, 0.1); 
  }
  hit(weaponId) { 
    if (weaponId === 'AXE') this.playTone(100, 'square', 0.2, 0.25); 
    else this.playTone(200, 'square', 0.1, 0.15); 
  }
  itemPickup() {
    this.playTone(600, 'sine', 0.1, 0.1); setTimeout(() => this.playTone(800, 'sine', 0.1, 0.1), 50);
  }
  levelUp() {
    [440, 554, 659, 880].forEach((freq, i) => { setTimeout(() => this.playTone(freq, 'square', 0.15, 0.15), i * 120); });
  }
  hurt() {
    // 데미지 입을 때 소리
    this.playTone(150, 'sawtooth', 0.2, 0.2);
  }
  crash() { 
    // 게임오버 시
    this.playTone(120, 'sawtooth', 0.3, 0.2); setTimeout(() => this.playTone(80, 'sawtooth', 0.4, 0.25), 150); 
  }
}
const sound = new SoundManager();

/* ==========================================================================
   3. 캔버스 및 상태 설정
   ========================================================================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const uiScore = document.getElementById('scoreDisplay');
const weaponNameEl = document.getElementById('weaponName');
const levelDisplay = document.getElementById('levelDisplay');
const levelProgress = document.getElementById('levelProgress');
const killsToNextLevelEl = document.getElementById('killsToNextLevel');
const hearts = [document.getElementById('heart-1'), document.getElementById('heart-2'), document.getElementById('heart-3')];

const GAME_WIDTH = 800;
const GAME_HEIGHT = 400;
const GROUND_Y = GAME_HEIGHT - 60; 

let frames = 0, score = 0, highScore = 0, level = 1, killsInLevel = 0;
let initialSpeed = 4.0, gameSpeed = initialSpeed; 
let isPlaying = false, hitPause = 0, isLevelingUp = false, levelUpTimer = 0;
let animationId = null;

let playerHealth = MAX_HEALTH;

let enemies = [], particles = [], items = [], floatingTexts = [];

/* ==========================================================================
   4. 졸라맨(Player) 클래스
   ========================================================================== */
class Player {
  constructor() {
    this.x = 150; 
    this.y = GROUND_Y;
    this.width = 35;  
    this.height = 70; 
    this.color = '#111111'; 
    this.headRadius = 14; 
    
    this.weapon = WEAPONS.BASIC;
    this.isAttacking = false;
    this.attackFrame = 0;
    this.isDead = false;
    
    // 무적 상태 속성 추가
    this.invulnerableTimer = 0;
  }
  
  equip(weaponId) {
    this.weapon = WEAPONS[weaponId];
    weaponNameEl.innerText = this.weapon.name;
    weaponNameEl.style.color = this.weapon.color;
    sound.itemPickup();
    floatingTexts.push(new FloatingText(this.x, this.y - 90, `${this.weapon.name} 장착!`, this.weapon.color, 24));
  }
  
  update() {
    if (this.isDead) return;
    
    // 무적 시간 감소
    if (this.invulnerableTimer > 0) {
      this.invulnerableTimer--;
    }
    
    if (this.isAttacking) {
      this.attackFrame++;
      if (this.attackFrame > this.weapon.duration) {
        this.isAttacking = false;
        this.attackFrame = 0;
      }
    }
  }
  
  attack() {
    if (this.isDead) return;
    if (this.isAttacking) return; 
    
    this.isAttacking = true;
    this.attackFrame = 0;
    sound.slash(this.weapon.id);
  }
  
  takeDamage() {
    if (this.isDead || this.invulnerableTimer > 0) return false;
    
    playerHealth--;
    updateHealthUI();
    
    if (playerHealth <= 0) {
      gameOver();
    } else {
      sound.hurt();
      this.invulnerableTimer = 90; // 약 1.5초간 무적 (60fps 기준)
      floatingTexts.push(new FloatingText(this.x, this.y - 50, `-1`, '#ef4444', 30));
    }
    return true;
  }
  
  getBodyHitbox() { 
    if (this.isDead || this.invulnerableTimer > 0) return null; // 무적일 땐 충돌 판정 없음
    return { x: this.x - this.width/2 + 5, y: this.y - this.height + 5, w: this.width - 10, h: this.height - 5 }; 
  }
  
  getWeaponHitbox() {
    if (!this.isAttacking || this.isDead) return null;
    let progress = this.attackFrame / this.weapon.duration;
    if (progress < 0.2 || progress > 0.7) return null; 
    return { x: this.x, y: this.y - this.height - 20, w: this.weapon.range, h: this.height + 20 };
  }
  
  draw() {
    if (this.isDead) return;
    
    // 무적 상태일 때 깜빡임 효과
    if (this.invulnerableTimer > 0 && Math.floor(frames / 5) % 2 === 0) {
      return; 
    }
    
    ctx.save();
    let time = frames * 0.15; 
    let headY = this.y - this.height + this.headRadius;
    let neckY = headY + this.headRadius;
    let pelvisY = this.y - 30;
    
    ctx.lineWidth = 7; 
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    
    // === 무기 및 팔 ===
    if (this.isAttacking) {
      let progress = this.attackFrame / this.weapon.duration; 
      
      ctx.strokeStyle = this.color;
      ctx.beginPath(); ctx.moveTo(this.x, neckY + 5); 
      let handX = this.x + 30;
      let handY = neckY + 15;
      
      if (progress < 0.3) handY = neckY - 15; 
      else if (progress < 0.6) handY = neckY + 25; 
      
      ctx.lineTo(handX, handY); ctx.stroke();

      ctx.strokeStyle = this.weapon.color;
      ctx.lineWidth = (this.weapon.id === 'AXE') ? 9 : 6; 
      ctx.beginPath(); ctx.moveTo(handX, handY);
      
      let swordEndX, swordEndY;
      if (this.weapon.id === 'SPEAR') {
        if (progress < 0.3) { swordEndX = handX - 20; swordEndY = handY - 10; }
        else { swordEndX = handX + this.weapon.range - 20; swordEndY = handY; }
      } else {
        if (progress < 0.3) { swordEndX = handX + 15; swordEndY = handY - (this.weapon.range * 0.5); }
        else if (progress < 0.6) { swordEndX = handX + (this.weapon.range * 0.6); swordEndY = handY + 15; }
        else { swordEndX = handX + (this.weapon.range * 0.5); swordEndY = handY + 35; }
      }
      ctx.lineTo(swordEndX, swordEndY); ctx.stroke();

      if (progress > 0.1 && progress < 0.6) {
        ctx.strokeStyle = this.weapon.effect;
        if (this.weapon.id === 'SPEAR') {
          ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(handX + 30, handY); ctx.lineTo(handX + this.weapon.range, handY); ctx.stroke();
        } else {
          ctx.lineWidth = (this.weapon.id === 'AXE') ? 30 : 18; ctx.beginPath();
          ctx.arc(this.x, neckY + 15, this.weapon.range * 0.6, Math.PI * 1.6, Math.PI * 0.1, false); ctx.stroke();
        }
      }
    } else {
      ctx.strokeStyle = this.color;
      ctx.beginPath(); ctx.moveTo(this.x, neckY + 5); 
      let handX = this.x - 20; let handY = neckY + 20;
      ctx.lineTo(handX, handY); ctx.stroke();
      
      ctx.strokeStyle = this.weapon.color;
      ctx.lineWidth = (this.weapon.id === 'AXE') ? 9 : 6;
      ctx.beginPath(); ctx.moveTo(handX, handY);
      ctx.lineTo(handX - (this.weapon.range * 0.3), handY - (this.weapon.range * 0.4)); ctx.stroke();
    }

    // === 본체 ===
    ctx.strokeStyle = this.color; 
    ctx.lineWidth = 7;
    let swing = Math.sin(time) * 20; 
    
    ctx.beginPath(); ctx.arc(this.x, headY, this.headRadius, 0, Math.PI*2); 
    // 무적 상태일 때 머리 색을 약간 붉게
    ctx.fillStyle = this.invulnerableTimer > 0 ? '#fee2e2' : '#fff'; 
    ctx.fill(); 
    ctx.stroke();
    
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(this.x - this.headRadius, headY);
    ctx.lineTo(this.x - this.headRadius - 15 + Math.sin(time*2)*5, headY - 5 + Math.cos(time)*5);
    ctx.lineTo(this.x - this.headRadius - 25 + Math.sin(time*2)*10, headY + 5 + Math.cos(time)*10);
    ctx.stroke();
    
    ctx.strokeStyle = this.color; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(this.x, neckY); ctx.lineTo(this.x + 4, pelvisY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(this.x + 4, pelvisY); ctx.lineTo(this.x + 4 + (swing*0.6), pelvisY + 15); ctx.lineTo(this.x + swing, this.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(this.x + 4, pelvisY); ctx.lineTo(this.x + 4 - (swing*0.6), pelvisY + 15); ctx.lineTo(this.x - swing, this.y); ctx.stroke();
    
    ctx.restore();
  }
}

/* ==========================================================================
   5. 적, 무기 아이템, 파티클 클래스
   ========================================================================== */
const ENEMY_TYPES = [
  { type: 'NORMAL', color: '#000000', outline: '#ef4444', w: 35, h: 70, speedOffset: 0, yOffset: 0, head: 14 },
  { type: 'FAST', color: '#000000', outline: '#f97316', w: 25, h: 50, speedOffset: 2.5, yOffset: 0, head: 10 },
  { type: 'TANK', color: '#000000', outline: '#8b5cf6', w: 50, h: 90, speedOffset: -1.0, yOffset: 0, head: 18 },
  { type: 'FLY', color: '#000000', outline: '#0ea5e9', w: 40, h: 35, speedOffset: 1.0, yOffset: 70, head: 12 }
];

class Enemy {
  constructor() {
    this.x = GAME_WIDTH + 50;
    let rand = Math.random();
    if (rand < 0.5) this.info = ENEMY_TYPES[0]; 
    else if (rand < 0.7) this.info = ENEMY_TYPES[1]; 
    else if (rand < 0.85) this.info = ENEMY_TYPES[2]; 
    else this.info = ENEMY_TYPES[3]; 
    
    this.y = GROUND_Y - this.info.yOffset;
    this.width = this.info.w; this.height = this.info.h;
    this.markedForDeletion = false;
    this.frameOffset = Math.random() * 100; 
  }
  update() {
    let speedMult = 1 + (level * 0.05); 
    this.x -= (gameSpeed + (this.info.speedOffset * speedMult));
    if (this.x + this.width < 0) this.markedForDeletion = true;
    if (this.info.type === 'FLY') this.y = GROUND_Y - this.info.yOffset + Math.sin(frames * 0.15) * 20;
  }
  getHitbox() { return { x: this.x - this.width/2 + 5, y: this.y - this.height + 5, w: this.width - 10, h: this.height - 5 }; }
  draw() {
    ctx.save();
    ctx.strokeStyle = this.info.color; ctx.lineWidth = (this.info.type === 'TANK') ? 10 : 7;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    
    let time = (frames + this.frameOffset) * 0.2 * (1 + this.info.speedOffset*0.2); 
    let headY = this.y - this.height + this.info.head; 
    let neckY = headY + this.info.head; 
    let pelvisY = this.y - (this.height * 0.4);
    let swing = Math.sin(time) * (18 * (this.info.w / 35)); 
    
    ctx.beginPath(); ctx.arc(this.x, headY, this.info.head, 0, Math.PI*2);
    ctx.fillStyle = this.info.outline; ctx.fill(); 
    ctx.stroke();
    
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); 
    ctx.moveTo(this.x - 4, headY - 3); ctx.lineTo(this.x + 4, headY + 3);
    ctx.moveTo(this.x + 4, headY - 3); ctx.lineTo(this.x - 4, headY + 3); ctx.stroke();

    ctx.strokeStyle = this.info.color; ctx.lineWidth = (this.info.type === 'TANK') ? 10 : 7;
    ctx.beginPath(); ctx.moveTo(this.x, neckY); ctx.lineTo(this.x - 4, pelvisY); ctx.stroke();
    
    if (this.info.type === 'FLY') {
      let flap = Math.sin(frames * 0.4) * 20;
      ctx.beginPath(); ctx.moveTo(this.x, neckY); ctx.lineTo(this.x - 25, neckY - flap); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(this.x, neckY); ctx.lineTo(this.x + 25, neckY - flap); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(this.x, neckY + 5); ctx.lineTo(this.x - (this.width*0.7), neckY + 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(this.x - 4, pelvisY); ctx.lineTo(this.x - 4 + (swing*0.6), pelvisY + 15); ctx.lineTo(this.x + swing, this.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(this.x - 4, pelvisY); ctx.lineTo(this.x - 4 - (swing*0.6), pelvisY + 15); ctx.lineTo(this.x - swing, this.y); ctx.stroke();
    }
    ctx.restore();
  }
}

class Item {
  constructor(x, y) {
    this.x = x; this.y = y;
    let availableKeys = WEAPON_KEYS.filter(k => k !== player.weapon.id);
    this.weaponId = availableKeys[Math.floor(Math.random() * availableKeys.length)];
    this.weaponInfo = WEAPONS[this.weaponId];
    this.markedForDeletion = false; this.vy = -6;
  }
  update() {
    this.x -= gameSpeed; 
    this.y += this.vy; this.vy += 0.5; 
    if (this.y >= GROUND_Y - 15) { this.y = GROUND_Y - 15; this.vy = 0; }
    if (this.x < -30) this.markedForDeletion = true;
  }
  getHitbox() { return { x: this.x - 20, y: this.y - 30, w: 40, h: 40 }; }
  draw() {
    ctx.save();
    let floatY = this.y + (this.vy === 0 ? Math.sin(frames * 0.15) * 8 : 0);
    ctx.globalAlpha = 0.8; ctx.fillStyle = this.weaponInfo.color;
    ctx.beginPath(); ctx.arc(this.x, floatY - 15, 20, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(this.x - 10, floatY - 5); ctx.lineTo(this.x + 10, floatY - 25); ctx.stroke();
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 12; this.vy = (Math.random() - 1) * 10; 
    this.size = Math.random() * 8 + 4; this.color = color;
    this.life = 1; this.decay = Math.random() * 0.05 + 0.03; 
  }
  update() { this.x += this.vx; this.y += this.vy; this.vy += 0.5; this.life -= this.decay; }
  draw() {
    ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size/2, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
  }
}

class FloatingText {
  constructor(x, y, text, color, size = 20) {
    this.x = x; this.y = y; this.text = text; this.color = color; this.size = size;
    this.life = 1; this.vy = -2;
  }
  update() { this.y += this.vy; this.life -= 0.02; } 
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.font = `900 ${this.size}px "Jua", sans-serif`; 
    ctx.textAlign = 'center';
    
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#111';
    ctx.strokeText(this.text, this.x, this.y);
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
}

/* ==========================================================================
   6. 게임 핵심 로직 
   ========================================================================== */
let player;

function initGame() {
  player = new Player();
  weaponNameEl.innerText = player.weapon.name;
  weaponNameEl.style.color = player.weapon.color;
  
  enemies = []; particles = []; items = []; floatingTexts = [];
  frames = 0; score = 0; hitPause = 0; 
  level = 1; killsInLevel = 0;
  
  playerHealth = MAX_HEALTH;
  updateHealthUI();
  
  initialSpeed = 4.0; gameSpeed = initialSpeed; 
  isLevelingUp = false; levelUpTimer = 0;
  
  updateUI();
}

function updateHealthUI() {
  hearts.forEach((heartEl, idx) => {
    if (idx < playerHealth) {
      heartEl.classList.remove('empty');
    } else {
      heartEl.classList.add('empty');
    }
  });
}

function updateUI() {
  uiScore.innerText = score;
  levelDisplay.innerText = `LV.${level}`;
  killsToNextLevelEl.innerText = KILLS_PER_LEVEL - killsInLevel;
  levelProgress.style.width = `${(killsInLevel / KILLS_PER_LEVEL) * 100}%`;
}

function spawnEnemy() {
  if (isLevelingUp) return;
  let spawnRate = Math.max(40, 130 - (level * 10) - Math.floor(gameSpeed * 5)); 
  if (frames % spawnRate === 0) {
    enemies.push(new Enemy());
    if (Math.random() < 0.2 + (level * 0.05) && frames > 200) {
      setTimeout(() => { if(isPlaying && !isLevelingUp) enemies.push(new Enemy()); }, 350);
    }
  }
}

function triggerLevelUp() {
  isLevelingUp = true;
  levelUpTimer = 150; 
  sound.levelUp();
  
  enemies.forEach(e => {
    for(let j=0; j<15; j++) particles.push(new Particle(e.x, e.y - 30, e.info.outline));
  });
  enemies = [];
  
  level++; killsInLevel = 0;
  initialSpeed += 0.6; gameSpeed = initialSpeed;
  updateUI();
  
  // 레벨업 시 체력 1 회복
  if (playerHealth < MAX_HEALTH) {
    playerHealth++;
    updateHealthUI();
    floatingTexts.push(new FloatingText(player.x, player.y - 50, `+1 HP`, '#10b981', 24));
  }
  
  let lvlColor = LEVEL_COLORS[(level - 1) % LEVEL_COLORS.length];
  floatingTexts.push(new FloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2, `STAGE CLEAR!`, '#f59e0b', 55));
  floatingTexts.push(new FloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2 + 60, `LEVEL ${level}`, lvlColor, 45));
}

function update() {
  if (hitPause > 0) { hitPause--; return; }

  if (isLevelingUp) {
    levelUpTimer--;
    if (levelUpTimer <= 0) isLevelingUp = false;
    player.update(); 
  } else {
    player.update();
  }

  const playerBody = player.getBodyHitbox();
  const weaponBox = player.getWeaponHitbox();
  
  for (let i = 0; i < items.length; i++) {
    let item = items[i]; item.update();
    if (playerBody && checkCollision(playerBody, item.getHitbox())) {
      player.equip(item.weaponId); item.markedForDeletion = true;
    }
  }

  for (let i = 0; i < enemies.length; i++) {
    let enemy = enemies[i]; enemy.update();
    
    // 타격 성공 (적 처치)
    if (weaponBox && checkCollision(weaponBox, enemy.getHitbox()) && !enemy.markedForDeletion) {
      enemy.markedForDeletion = true;
      sound.hit(player.weapon.id);
      score++; killsInLevel++;
      
      if (killsInLevel >= KILLS_PER_LEVEL) triggerLevelUp();
      else updateUI(); 
      
      for(let j=0; j<10; j++) particles.push(new Particle(enemy.x, enemy.y - 30, enemy.info.outline));
      for(let j=0; j<5; j++) particles.push(new Particle(enemy.x, enemy.y - 30, '#111'));
      
      if (Math.random() < 0.35) items.push(new Item(enemy.x, enemy.y));
      hitPause = player.weapon.hitPause; 
      continue;
    }
    
    // 적과 부딪힘 (데미지 입음)
    if (!isLevelingUp && playerBody && checkCollision(playerBody, enemy.getHitbox()) && !enemy.markedForDeletion) {
      let tookDamage = player.takeDamage();
      if (tookDamage) {
        // 데미지를 주었으면 그 적은 파괴되어 사라짐 (안 그러면 계속 충돌함)
        enemy.markedForDeletion = true;
        for(let j=0; j<5; j++) particles.push(new Particle(enemy.x, enemy.y - 30, '#ef4444'));
      }
      if (playerHealth <= 0) return; // 게임오버면 업데이트 종료
    }
  }
  
  for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); if (particles[i].life <= 0) particles.splice(i, 1); }
  for (let i = floatingTexts.length - 1; i >= 0; i--) { floatingTexts[i].update(); if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1); }

  enemies = enemies.filter(e => !e.markedForDeletion);
  items = items.filter(i => !i.markedForDeletion);
  
  spawnEnemy();
  gameSpeed += 0.0005; 
  frames++;
}

function checkCollision(r1, r2) {
  if (!r1 || !r2) return false;
  return (r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y);
}

function drawBackground() {
  let bgLineColor = LEVEL_COLORS[(level - 1) % LEVEL_COLORS.length];
  
  ctx.strokeStyle = '#111'; 
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(10, GROUND_Y); ctx.lineTo(GAME_WIDTH - 10, GROUND_Y); ctx.stroke();
  
  ctx.strokeStyle = bgLineColor;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(10, GROUND_Y + 10); ctx.lineTo(GAME_WIDTH - 10, GROUND_Y + 10); ctx.stroke();

  let offset = (frames * gameSpeed) % 150;
  for (let i = -150; i < GAME_WIDTH + 150; i += 150) {
    let x = i - offset;
    ctx.strokeStyle = '#111';
    ctx.beginPath(); ctx.moveTo(x + 20, GROUND_Y); ctx.lineTo(x + 15, GROUND_Y - 15);
    ctx.moveTo(x + 20, GROUND_Y); ctx.lineTo(x + 28, GROUND_Y - 10); ctx.stroke();
  }
}

function draw() {
  if (hitPause > 0) ctx.fillStyle = '#ffcccc'; 
  else ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
  
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2;
  for(let i=40; i<GAME_HEIGHT; i+=40) {
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(GAME_WIDTH, i); ctx.stroke();
  }
  
  drawBackground();
  
  items.forEach(i => i.draw());
  enemies.forEach(e => e.draw());
  player.draw();
  particles.forEach(p => p.draw());
  floatingTexts.forEach(t => t.draw());
}

function loop() {
  if (!isPlaying) return;
  update();
  if (isPlaying) { draw(); animationId = requestAnimationFrame(loop); }
}

function gameOver() {
  isPlaying = false;
  player.isDead = true;
  sound.crash();
  
  for(let j=0; j<60; j++) particles.push(new Particle(player.x, player.y - 30, '#ef4444'));
  
  if (score > highScore) { highScore = score; localStorage.setItem('stickmanLvLHighScore', highScore); }
  
  document.getElementById('finalLevel').innerText = `LV.${level}`;
  document.getElementById('finalScore').innerText = score;
  document.getElementById('bestScore').innerText = highScore;
  
  setTimeout(() => { document.getElementById('gameOverScreen').classList.remove('hidden'); }, 800);

  if (animationId) cancelAnimationFrame(animationId);
  function deadLoop() {
    if (isPlaying) return; 
    
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2;
    for(let i=40; i<GAME_HEIGHT; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(GAME_WIDTH, i); ctx.stroke(); }
    drawBackground();
    items.forEach(i => i.draw());
    enemies.forEach(e => e.draw());
    
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update(); particles[i].draw();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      floatingTexts[i].update(); floatingTexts[i].draw();
      if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
    }
    
    animationId = requestAnimationFrame(deadLoop);
  }
  deadLoop();
}

function startGame() {
  if (animationId) cancelAnimationFrame(animationId);
  initGame();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  sound.init(); 
  isPlaying = true; 
  loop();
}

/* ==========================================================================
   8. 입력 및 이벤트
   ========================================================================== */
function handleInput(e) {
  if (!isPlaying || player.isDead) return;
  if (e.target && e.target.tagName === 'BUTTON') return;
  e.preventDefault(); 
  player.attack();
}

let isSpaceDown = false;
window.addEventListener('keydown', (e) => { 
  if (e.code === 'Space' && !isSpaceDown) {
    isSpaceDown = true;
    handleInput(e); 
  }
});
window.addEventListener('keyup', (e) => { 
  if (e.code === 'Space') isSpaceDown = false; 
});

window.addEventListener('touchstart', handleInput, { passive: false });
window.addEventListener('mousedown', handleInput);

function btnClick(e, action) {
  e.target.blur(); 
  action();
}

document.getElementById('startBtn').addEventListener('click', (e) => btnClick(e, startGame));
document.getElementById('restartBtn').addEventListener('click', (e) => btnClick(e, startGame));
document.getElementById('soundToggle').addEventListener('click', (e) => {
  sound.muted = !sound.muted; 
  e.target.innerText = sound.muted ? '🔇' : '🔊';
  e.target.blur();
});

const savedScore = localStorage.getItem('stickmanLvLHighScore');
if (savedScore) highScore = parseInt(savedScore);

window.onload = () => {
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  
  ctx.strokeStyle = '#111'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(150, GROUND_Y - 60, 14, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(150, GROUND_Y - 46); ctx.lineTo(150, GROUND_Y - 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(150, GROUND_Y - 30); ctx.lineTo(140, GROUND_Y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(150, GROUND_Y - 30); ctx.lineTo(160, GROUND_Y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(150, GROUND_Y - 40); ctx.lineTo(130, GROUND_Y - 25); ctx.stroke();
  
  ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(130, GROUND_Y - 25); ctx.lineTo(90, GROUND_Y - 65); ctx.stroke();
};
</script>
