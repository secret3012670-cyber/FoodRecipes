<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마스터-디테일 반응형 레이아웃</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md">
                M
            </div>
            <h1 class="text-xl font-bold tracking-tight text-slate-900">파일 미리보기</h1>
        </div>
        <div class="flex items-center space-x-3">
            <!-- 항목 추가 버튼 -->
            <button onclick="openModal()" class="flex items-center space-x-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-sm transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span>새 항목 추가하기</span>
            </button>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- 왼쪽: 목록 (Master) -->
        <section id="master-view" class="w-full md:w-1/3 lg:w-80 bg-white border-r border-slate-200 flex flex-col shrink-0 transition-all duration-300 z-10">
            <!-- 검색 및 필터 -->
            <div class="p-4 border-b border-slate-100">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="항목 검색..." 
                        class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
                    <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>

            <!-- 항목 리스트 -->
            <div id="item-list" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <!-- 자바스크립트로 동적 생성됨 -->
            </div>
        </section>

        <!-- 오른쪽: 미리보기 (Detail) -->
        <section id="detail-view" class="hidden md:flex flex-1 flex-col bg-slate-50 overflow-y-auto absolute md:relative inset-0 z-20 transition-all duration-300">
            <!-- 모바일 뒤로가기 버튼 -->
            <div class="md:hidden bg-white px-4 py-3 border-b border-slate-200 flex items-center shrink-0">
                <button id="back-btn" class="flex items-center text-indigo-600 font-medium text-sm hover:text-indigo-800 transition-colors">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    목록으로 돌아가기
                </button>
            </div>

            <!-- 상세 내용 영역 -->
            <div id="detail-content" class="p-6 md:p-10 max-w-5xl w-full mx-auto flex-1 flex flex-col">
                <!-- 초기 상태 안내 -->
                <div class="h-full flex flex-col items-center justify-center text-slate-400 text-center py-20">
                    <div class="w-16 h-16 bg-slate-200 rounded-2xl flex items-center justify-center mb-4 text-slate-500 shadow-inner">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                        </svg>
                    </div>
                    <p class="text-base font-medium text-slate-600">파일을 선택해주세요</p>
                    <p class="text-sm text-slate-400 mt-1">왼쪽 목록에서 확인할 항목을 클릭하거나 새로운 항목을 추가해보세요.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- 항목 추가/수정 모달 -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl animate-scaleUp">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">새 항목 추가</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form id="add-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">제목</label>
                    <input type="text" id="input-title" required placeholder="예: 프로젝트 기획서, 샘플 문서" 
                        class="w-full px-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">파일 이름 (경로)</label>
                    <input type="text" id="input-filepath" required placeholder="예: ./file/FoodRecipes.html" 
                        class="w-full px-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 font-mono">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">내용 입력 (HTML 코드 또는 텍스트)</label>
                    <textarea id="input-text-content" rows="6" placeholder="HTML 태그 또는 텍스트 내용을 입력하세요 (선택사항)..." 
                        class="w-full px-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 resize-none font-mono"></textarea>
                </div>

                <div class="flex items-center justify-end space-x-2 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-semibold transition-colors">
                        취소
                    </button>
                    <button type="submit" id="submit-btn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-sm transition-all">
                        저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 로직 -->
    <script>
        // 현재 호스팅 중인 기본 경로 정의 (한글 인코딩 안전 처리)
        const currentBasePath = decodeURIComponent(window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1));

        // 디폴트 샘플 데이터 등록 (레시피 등록 및 맥도날드 강아지)
        let items = [
            {
                id: 1,
                title: "레시피 등록",
                filePath: "./file/FoodRecipes.html",
                textContent: "",
                date: "2026-09-06"
            },
            {
                id: 2,
                title: "맥도날드 강아지",
                filePath: "./file/1.mp4",
                textContent: "",
                date: "2026-09-06"
            },
            {
                id: 3,
                title: "항목 강아지",
                filePath: "./file/2.mp4",
                textContent: "",
                date: "2026-09-06"
            },
            {
                id: 4,
                title: "클래식 졸라맨 검객 (생명력 추가)",
                filePath: "./file/3.html",
                textContent: "",
                date: "2026-09-06"
            },
            {
                id: 5,
                title: "4x4 카드 뒤집기 게임",
                filePath: "./file/4.html",
                textContent: "",
                date: "2026-09-06"
            },
            {
                id: 6,
                title: "구구단 팡팡 모험",
                filePath: "./file/5.html",
                textContent: "",
                date: "2026-09-06"
            },
            {
                id: 7,
                title: "네온 테트리스)",
                filePath: "./file/6.html",
                textContent: "",
                date: "2026-09-06"
            }
        ];

        let selectedId = null;
        let searchQuery = "";

        const itemListEl = document.getElementById('item-list');
        const detailContentEl = document.getElementById('detail-content');
        const searchInputEl = document.getElementById('search-input');
        const backBtnEl = document.getElementById('back-btn');
        const detailViewEl = document.getElementById('detail-view');
        const addModalEl = document.getElementById('add-modal');

        // 모달 열기 (추가 모드)
        function openModal() {
            document.getElementById('modal-title').textContent = "새 항목 추가";
            document.getElementById('submit-btn').textContent = "저장하기";
            document.getElementById('edit-id').value = "";
            document.getElementById('add-form').reset();
            addModalEl.classList.remove('hidden');
            addModalEl.classList.add('flex');
        }

        // 모달 열기 (수정 모드)
        function openEditModal(id, event) {
            event.stopPropagation();
            const item = items.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modal-title').textContent = "항목 수정";
            document.getElementById('submit-btn').textContent = "수정 완료";
            document.getElementById('edit-id').value = item.id;
            
            document.getElementById('input-title').value = item.title;
            document.getElementById('input-filepath').value = item.filePath;
            document.getElementById('input-text-content').value = item.textContent;

            addModalEl.classList.remove('hidden');
            addModalEl.classList.add('flex');
        }

        function closeModal() {
            addModalEl.classList.remove('flex');
            addModalEl.classList.add('hidden');
            document.getElementById('add-form').reset();
        }

        // 항목 추가 및 수정 통합 핸들러
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const editId = document.getElementById('edit-id').value;
            const title = document.getElementById('input-title').value.trim();
            let rawPath = document.getElementById('input-filepath').value.trim();
            const textContent = document.getElementById('input-text-content').value;

            if (editId) {
                const idNum = Number(editId);
                items = items.map(item => {
                    if (item.id === idNum) {
                        return {
                            ...item,
                            title: title || rawPath,
                            filePath: rawPath,
                            textContent: textContent
                        };
                    }
                    return item;
                });
                closeModal();
                selectItem(idNum);
            } else {
                const newItem = {
                    id: Date.now(),
                    title: title || rawPath,
                    filePath: rawPath,
                    textContent: textContent,
                    date: new Date().toISOString().split('T')[0]
                };

                items.unshift(newItem);
                closeModal();
                selectItem(newItem.id);
            }
        }

        // 목록 렌더링 함수
        function renderList() {
            const filteredItems = items.filter(item => 
                item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                item.filePath.toLowerCase().includes(searchQuery.toLowerCase()) ||
                item.textContent.toLowerCase().includes(searchQuery.toLowerCase())
            );

            if (filteredItems.length === 0) {
                itemListEl.innerHTML = `
                    <div class="p-8 text-center text-slate-400 text-sm">
                        검색 결과가 없습니다.
                    </div>
                `;
                return;
            }

            itemListEl.innerHTML = filteredItems.map(item => `
                <div onclick="selectItem(${item.id})" 
                    class="p-4 cursor-pointer transition-all hover:bg-slate-50 flex items-center justify-between group ${selectedId === item.id ? 'bg-indigo-50/70 border-l-4 border-indigo-600' : 'border-l-4 border-transparent'}">
                    <div class="flex-1 min-w-0 pr-2">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xs text-slate-400 font-mono">${item.date}</span>
                            <span class="text-[10px] font-semibold px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-md font-mono">${item.filePath}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-sm mb-1 truncate ${selectedId === item.id ? 'text-indigo-600' : ''}">${item.title}</h3>
                        <p class="text-xs text-slate-400 truncate font-mono">${item.textContent ? item.textContent.substring(0, 25) + '...' : item.filePath}</p>
                    </div>
                    <!-- 수정 버튼 -->
                    <button onclick="openEditModal(${item.id}, event)" title="수정" class="opacity-0 group-hover:opacity-100 p-2 text-slate-400 hover:text-indigo-600 transition-all">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        // 상세 내용 미리보기 렌더링 함수
        function renderDetail() {
            if (!selectedId) {
                detailContentEl.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 text-center py-20">
                        <div class="w-16 h-16 bg-slate-200 rounded-2xl flex items-center justify-center mb-4 text-slate-500 shadow-inner">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                            </svg>
                        </div>
                        <p class="text-base font-medium text-slate-600">파일을 선택해주세요</p>
                        <p class="text-sm text-slate-400 mt-1">왼쪽 목록에서 확인할 항목을 클릭해보세요.</p>
                    </div>
                `;
                return;
            }

            const item = items.find(i => i.id === selectedId);
            if (!item) return;

            // 경로 조합 생성 (현재 베이스 경로 + 저장된 경로의 앞쪽 상대경로 슬래시 처리)
            const cleanRelativePath = item.filePath.replace(/^(\.\/|\/)/, '');
            const combinedFullPath = currentBasePath + cleanRelativePath;

            const isHtmlFile = item.filePath.endsWith('.html') || item.filePath.endsWith('.htm') || (item.textContent && (item.textContent.trim().startsWith('<!DOCTYPE') || item.textContent.trim().startsWith('<html')));
            const isVideoFile = item.filePath.endsWith('.mp4') || item.filePath.endsWith('.webm');

            detailContentEl.innerHTML = `
                <div class="space-y-4 flex-1 flex flex-col animate-fadeIn">
                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-4 shrink-0">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="text-[10px] font-semibold px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded-md font-mono">${item.filePath}</span>
                                <span class="text-xs text-slate-400">${item.date}</span>
                            </div>
                            <h2 class="text-xl md:text-2xl font-extrabold text-slate-900 mt-1">${item.title}</h2>
                            <p class="text-xs text-slate-500 mt-1 font-mono break-all">연결 경로: <a href="${combinedFullPath}" target="_blank" class="text-indigo-600 hover:underline">${combinedFullPath}</a></p>
                        </div>
                        <!-- 새창 열기 버튼 -->
                        <a href="${combinedFullPath}" target="_blank" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold flex items-center space-x-1 shadow-sm transition-colors">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                            <span>새창으로 열기</span>
                        </a>
                    </div>

                    <!-- 미리보기 컨테이너 -->
                    <div class="flex-1 rounded-2xl shadow-sm border border-slate-200 bg-white min-h-[450px] flex flex-col relative overflow-hidden">
                        ${isHtmlFile ? `
                            <iframe src="${combinedFullPath}" class="w-full flex-1 border-none min-h-[450px]" onerror="this.srcdoc='<div style=\\\'padding:20px;font-family:sans-serif;color:#666\\\'><h3>파일을 로드할 수 없습니다</h3><p>경로를 확인하거나 새창으로 열기를 시도해주세요.</p></div>'"></iframe>
                        ` : isVideoFile ? `
                            <div class="p-6 flex-1 flex flex-col items-center justify-center bg-slate-900">
                                <video controls class="max-w-full max-h-[400px] rounded-lg shadow-lg" src="${combinedFullPath}">
                                    브라우저가 비디오 태그를 지원하지 않습니다.
                                </video>
                                <p class="text-xs text-slate-400 mt-3 font-mono">비디오 소스: ${combinedFullPath}</p>
                            </div>
                        ` : item.textContent ? `
                            <div class="p-6 flex-1 overflow-y-auto">
                                <pre class="whitespace-pre-wrap font-sans text-slate-700 text-sm leading-relaxed">${item.textContent}</pre>
                            </div>
                        ` : `
                            <iframe src="${combinedFullPath}" class="w-full flex-1 border-none min-h-[450px]"></iframe>
                        `}
                    </div>
                </div>
            `;
        }

        // 항목 선택 핸들러
        window.selectItem = function(id) {
            selectedId = id;
            renderList();
            renderDetail();

            if (window.innerWidth < 768) {
                detailViewEl.classList.remove('hidden');
            }
        };

        // 모바일 뒤로가기 버튼 핸들러
        backBtnEl.addEventListener('click', () => {
            if (window.innerWidth < 768) {
                detailViewEl.classList.add('hidden');
                selectedId = null;
                renderList();
            }
        });

        // 실시간 검색 이벤트
        searchInputEl.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderList();
        });

        // 화면 크기 변경 감지
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                detailViewEl.classList.remove('hidden');
            } else {
                if (!selectedId) {
                    detailViewEl.classList.add('hidden');
                }
            }
        });

        // 초기 렌더링 실행
        if (items.length > 0) {
            selectItem(items[0].id);
        } else {
            renderList();
        }
    </script>
</body>
</html>
