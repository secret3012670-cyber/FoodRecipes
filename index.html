<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste.ai - 프리미엄 AI 레시피</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        brand: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 900: '#7c2d12' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .dark .glass-panel { background: rgba(24, 24, 27, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-zinc-950 min-h-screen text-slate-800 dark:text-zinc-100 flex flex-col transition-colors duration-300">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const apiKey = "AQ.Ab8RN6J0C7T6E2HSWgDQvMZYcdHEyy2HTg46Wkcxckqfwzy3Dw";

        const categorySystemPrompt = `You are a professional culinary expert. When a user searches for a food or dish name, provide 4 to 5 popular and distinct variations or styles of this dish in Korean with sophisticated descriptions.
        Respond ONLY with a valid JSON object matching this schema:
        {"categoryName": "음식이름", "subCategories": [{"name": "종류 이름", "desc": "세련된 설명"}]}`;

        const recipeSystemPrompt = `You are a professional AI chef. Provide a delicious, high-quality, and easy-to-follow recipe in Korean.
        Respond ONLY with a valid JSON object matching this schema:
        {"title": "음식 이름", "description": "고급스러운 소개", "prepTime": "15분", "cookTime": "20분", "servings": "2인분", "difficulty": "초급", "calories": "650 kcal", "estimatedCost": "12,000원", "ingredients": ["재료1 (용량)", "재료2 (용량)"], "steps": [{"instruction": "명확한 조리 방법", "duration": "5분"}]}`;

        async function fetchFromGemini(promptText, systemPrompt) {
            const models = ['gemini-1.5-flash', 'gemini-1.5-flash-8b', 'gemini-flash-latest'];
            let lastError = "";

            for (let attempt = 0; attempt < 2; attempt++) {
                for (let model of models) {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
                    const payload = {
                        contents: [{ parts: [{ text: promptText }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    };

                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'X-goog-api-key': apiKey
                            },
                            body: JSON.stringify(payload)
                        });
                        
                        if (!response.ok) {
                            const errorData = await response.json();
                            const errMsg = errorData.error?.message || response.statusText;
                            
                            if (errMsg.toLowerCase().includes("high demand") || response.status === 503 || response.status === 429) {
                                lastError = "현재 서버 사용량이 많아 응답이 지연되고 있습니다. 잠시 후 다시 시도해 주세요.";
                                continue; 
                            }
                            
                            lastError = `API 통신 오류: ${errMsg}`;
                            continue;
                        }
                        
                        const result = await response.json();
                        let text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        
                        if(text) {
                            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
                        }
                        
                        return JSON.parse(text);
                        
                    } catch (error) {
                        lastError = "네트워크 또는 통신 중 오류가 발생했습니다.";
                    }
                }
                if(attempt === 0) await new Promise(res => setTimeout(res, 1500));
            }
            throw new Error(lastError);
        }

        function App() {
            const [query, setQuery] = useState('');
            const [loading, setLoading] = useState(false);
            const [recipe, setRecipe] = useState(null);
            const [error, setError] = useState(null);
            const [recentSearches, setRecentSearches] = useState([]);
            const [darkMode, setDarkMode] = useState(false);
            const [stepNotes, setStepNotes] = useState({});
            const [checkedSteps, setCheckedSteps] = useState({});
            const [subCategoryData, setSubCategoryData] = useState(null);
            const [history, setHistory] = useState([]);
            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [showStatsModal, setShowStatsModal] = useState(false);
            const [alreadyRecorded, setAlreadyRecorded] = useState(false);
            const [likesMap, setLikesMap] = useState({});

            useEffect(() => {
                try {
                    const savedSearches = localStorage.getItem('recent_recipe_searches');
                    if (savedSearches) {
                        const parsed = JSON.parse(savedSearches);
                        if(Array.isArray(parsed)) setRecentSearches(parsed);
                    }
                    
                    const savedHistory = localStorage.getItem('cooking_history');
                    if (savedHistory) {
                        const parsed = JSON.parse(savedHistory);
                        if(Array.isArray(parsed)) setHistory(parsed);
                    }
                    
                    const savedLikes = localStorage.getItem('recipe_likes');
                    if (savedLikes) {
                        const parsed = JSON.parse(savedLikes);
                        if(typeof parsed === 'object' && parsed !== null) setLikesMap(parsed);
                    }
                    
                    const savedTheme = localStorage.getItem('theme');
                    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        setDarkMode(true);
                        document.documentElement.classList.add('dark');
                    }
                } catch (e) {
                    console.error("데이터 로드 에러:", e);
                }
            }, []);

            useEffect(() => {
                if (recipe) {
                    setAlreadyRecorded(false);
                    try {
                        const savedNotes = localStorage.getItem(`notes_${recipe.title}`);
                        setStepNotes(savedNotes ? JSON.parse(savedNotes) : {});
                        
                        const savedChecks = localStorage.getItem(`checks_${recipe.title}`);
                        setCheckedSteps(savedChecks ? JSON.parse(savedChecks) : {});
                    } catch(e) {
                        setStepNotes({});
                        setCheckedSteps({});
                    }
                    
                    if (likesMap[recipe.title] === undefined) {
                        const defaultLikes = Math.floor(Math.random() * 80) + 20;
                        const updated = { ...likesMap, [recipe.title]: { count: defaultLikes, liked: false } };
                        setLikesMap(updated);
                        localStorage.setItem('recipe_likes', JSON.stringify(updated));
                    }
                }
            }, [recipe]);

            const handleLikeToggle = () => {
                if (!recipe) return;
                const current = likesMap[recipe.title] || { count: 20, liked: false };
                const newLiked = !current.liked;
                const newCount = newLiked ? current.count + 1 : current.count - 1;
                const updated = { ...likesMap, [recipe.title]: { count: newCount, liked: newLiked } };
                setLikesMap(updated);
                localStorage.setItem('recipe_likes', JSON.stringify(updated));
            };

            const toggleCheckStep = (idx) => {
                const updated = { ...checkedSteps, [idx]: !checkedSteps[idx] };
                setCheckedSteps(updated);
                if (recipe) localStorage.setItem(`checks_${recipe.title}`, JSON.stringify(updated));
            };

            const handleNoteChange = (idx, value) => {
                const updated = { ...stepNotes, [idx]: value };
                setStepNotes(updated);
                if (recipe) localStorage.setItem(`notes_${recipe.title}`, JSON.stringify(updated));
            };

            const toggleDarkMode = () => {
                setDarkMode(!darkMode);
                document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', !darkMode ? 'dark' : 'light');
            };

            const addRecentSearch = (searchTerm) => {
                const trimmed = searchTerm.trim();
                if (!trimmed) return;
                setRecentSearches(prev => {
                    const validPrev = Array.isArray(prev) ? prev : [];
                    const updated = [trimmed, ...validPrev.filter(item => item !== trimmed)].slice(0, 10);
                    localStorage.setItem('recent_recipe_searches', JSON.stringify(updated));
                    return updated;
                });
            };

            const removeRecentSearch = (e, term) => {
                e.stopPropagation();
                setRecentSearches(prev => {
                    const validPrev = Array.isArray(prev) ? prev : [];
                    const updated = validPrev.filter(item => item !== term);
                    localStorage.setItem('recent_recipe_searches', JSON.stringify(updated));
                    return updated;
                });
            };

            const clearAllRecentSearches = () => {
                setRecentSearches([]);
                localStorage.removeItem('recent_recipe_searches');
            };

            const recordCookingHistory = () => {
                if (!recipe || alreadyRecorded) return;
                const newRecord = {
                    title: recipe.title,
                    date: new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }),
                    calories: recipe.calories,
                    servings: recipe.servings,
                    difficulty: recipe.difficulty
                };
                const currentHistory = Array.isArray(history) ? history : [];
                const updatedHistory = [newRecord, ...currentHistory];
                setHistory(updatedHistory);
                localStorage.setItem('cooking_history', JSON.stringify(updatedHistory));
                setAlreadyRecorded(true);
            };

            const clearHistory = () => {
                if(confirm("모든 요리 기록을 삭제하시겠습니까?")) {
                    setHistory([]);
                    localStorage.removeItem('cooking_history');
                }
            };

            const handleSearch = async (searchTarget) => {
                const target = searchTarget || query;
                const trimmed = target.trim();
                if (!trimmed) return;

                if (!searchTarget) setQuery(trimmed);
                addRecentSearch(trimmed);

                setError(null);
                setRecipe(null);
                setSubCategoryData(null);
                setLoading(true);

                try {
                    const data = await fetchFromGemini(`"${trimmed}"의 다양한 세부 종류나 스타일 4가지를 알려주세요.`, categorySystemPrompt);
                    setSubCategoryData(data);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const executeFetchRecipe = async (target) => {
                setQuery(target);
                addRecentSearch(target);

                setError(null);
                setLoading(true);
                setSubCategoryData(null);

                try {
                    const data = await fetchFromGemini(`"${target}" 레시피를 자세히 알려주세요.`, recipeSystemPrompt);
                    setRecipe(data);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const totalSteps = recipe?.steps?.length || 0;
            const completedCount = Object.values(checkedSteps).filter(Boolean).length;
            const progressPercent = totalSteps > 0 ? Math.round((completedCount / totalSteps) * 100) : 0;
            const isFullyCompleted = totalSteps > 0 && completedCount === totalSteps;

            useEffect(() => {
                if (isFullyCompleted && !alreadyRecorded) recordCookingHistory();
            }, [isFullyCompleted]);

            const safeHistory = Array.isArray(history) ? history : [];
            const totalCookCount = safeHistory.length;
            const totalCaloriesNum = safeHistory.reduce((acc, cur) => {
                const match = cur.calories?.match(/\d+/g);
                return match ? acc + parseInt(match.join(''), 10) : acc;
            }, 0);

            const dishCounts = safeHistory.reduce((acc, cur) => {
                if(cur && cur.title) acc[cur.title] = (acc[cur.title] || 0) + 1;
                return acc;
            }, {});

            const chartData = Object.entries(dishCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const maxChartCount = chartData.length > 0 ? Math.max(...chartData.map(item => item[1])) : 1;
            const currentLikeData = recipe ? (likesMap[recipe.title] || { count: 0, liked: false }) : { count: 0, liked: false };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Header */}
                    <header className="sticky top-0 z-40 w-full glass-panel border-b border-slate-200/60 dark:border-zinc-800/60">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
                            <div 
                                className="flex items-center gap-3 cursor-pointer group"
                                onClick={() => { setRecipe(null); setSubCategoryData(null); setQuery(''); setError(null); }}
                            >
                                <div className="w-8 h-8 sm:w-10 sm:h-10 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-lg flex items-center justify-center text-sm sm:text-lg shadow-md transition-transform group-hover:scale-105">
                                    <i className="fa-solid fa-utensils"></i>
                                </div>
                                <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Taste.ai</h1>
                            </div>
                            
                            <div className="flex items-center gap-3 sm:gap-5">
                                <button type="button" onClick={() => setShowStatsModal(true)} className="hidden sm:flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-slate-900 dark:text-zinc-400 dark:hover:text-white transition-colors">
                                    <i className="fa-solid fa-chart-simple"></i> 통계
                                </button>
                                <button type="button" onClick={() => setShowHistoryModal(true)} className="flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-slate-900 dark:text-zinc-400 dark:hover:text-white transition-colors">
                                    <i className="fa-solid fa-book-open"></i> 요리기록
                                </button>
                                <div className="w-px h-4 bg-slate-300 dark:bg-zinc-700 mx-1"></div>
                                <button type="button" onClick={toggleDarkMode} className="w-9 h-9 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200 dark:text-zinc-400 dark:hover:bg-zinc-800 transition-colors">
                                    {darkMode ? <i className="fa-solid fa-sun"></i> : <i className="fa-solid fa-moon"></i>}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 py-10 sm:py-16">
                        
                        {/* Main Empty State */}
                        {!recipe && !subCategoryData && (
                            <div className="flex flex-col items-center justify-center mt-4 sm:mt-12 text-center space-y-6">
                                <div className="w-24 h-24 sm:w-32 sm:h-32 rounded-3xl shadow-sm border border-slate-200 dark:border-zinc-800 flex items-center justify-center bg-white dark:bg-zinc-900 text-4xl sm:text-5xl text-amber-500">
                                    <i className="fa-solid fa-bell-concierge"></i>
                                </div>
                                <h2 className="text-3xl sm:text-5xl font-extrabold text-slate-900 dark:text-white tracking-tight leading-tight">
                                    오늘 어떤 요리를 <br className="sm:hidden" />
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-500">준비해볼까요?</span>
                                </h2>
                                <p className="text-slate-500 dark:text-zinc-400 max-w-md mx-auto text-sm sm:text-base">
                                    신선한 식재료나 원하시는 메뉴를 입력해주세요.<br/>AI 셰프가 완벽한 레시피를 제안합니다.
                                </p>
                            </div>
                        )}

                        {/* Search Bar (Large) */}
                        {(!recipe && !subCategoryData) ? (
                            <div className="w-full max-w-2xl mx-auto mt-10">
                                <div className="relative group">
                                    <div className="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none">
                                        <i className="fa-solid fa-magnifying-glass text-slate-400 dark:text-zinc-500"></i>
                                    </div>
                                    <input
                                        type="text"
                                        value={query}
                                        onChange={(e) => setQuery(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleSearch()}
                                        placeholder="알리오 올리오, 김치볶음밥 검색..."
                                        className="w-full bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-full py-4 sm:py-5 pl-14 pr-32 text-base sm:text-lg text-slate-900 dark:text-white shadow-sm focus:border-amber-400 focus:ring-4 focus:ring-amber-500/10 outline-none transition-all"
                                    />
                                    <button
                                        type="button"
                                        onClick={() => handleSearch()}
                                        disabled={loading}
                                        className="absolute right-2 top-2 bottom-2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-full px-6 sm:px-8 font-bold text-sm sm:text-base disabled:opacity-50 hover:bg-slate-800 dark:hover:bg-slate-100 transition-colors"
                                    >
                                        {loading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : '검색'}
                                    </button>
                                </div>
                            </div>
                        ) : (
                            /* Search Bar (Compact) */
                            <div className="w-full max-w-5xl mb-10 flex gap-3">
                                <div className="relative flex-1">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i className="fa-solid fa-magnifying-glass text-slate-400"></i>
                                    </div>
                                    <input
                                        type="text"
                                        value={query}
                                        onChange={(e) => setQuery(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleSearch()}
                                        placeholder="다른 레시피 검색하기..."
                                        className="w-full bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl py-3 pl-10 pr-4 text-slate-900 dark:text-white outline-none focus:border-amber-500 transition-all shadow-sm"
                                    />
                                </div>
                                <button
                                    type="button"
                                    onClick={() => handleSearch()}
                                    disabled={loading}
                                    className="bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-xl px-6 font-bold text-sm disabled:opacity-50 hover:bg-slate-800 dark:hover:bg-slate-100 transition-colors shadow-sm"
                                >
                                    {loading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : '검색'}
                                </button>
                            </div>
                        )}

                        {/* Error Message */}
                        {error && (
                            <div className="mt-6 bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800/50 text-rose-700 dark:text-rose-400 p-4 rounded-xl text-center text-sm font-medium max-w-2xl mx-auto flex items-center justify-center gap-2">
                                <i className="fa-solid fa-circle-exclamation"></i> 
                                <span>{error}</span>
                            </div>
                        )}

                        {/* Loading State */}
                        {loading && (
                            <div className="mt-20 text-center py-12 space-y-4">
                                <i className="fa-solid fa-circle-notch fa-spin text-4xl text-amber-500"></i>
                                <p className="text-slate-600 dark:text-zinc-400 font-medium text-sm">AI 셰프가 최적의 레시피를 구성하고 있습니다...</p>
                            </div>
                        )}

                        {/* Sub Categories (Options) */}
                        {subCategoryData && !loading && (
                            <div className="mt-4">
                                <div className="mb-8 border-b border-slate-200 dark:border-zinc-800 pb-4">
                                    <h2 className="text-2xl font-bold text-slate-900 dark:text-white">
                                        추천하는 <span className="text-amber-500">'{subCategoryData.categoryName}'</span> 스타일입니다.
                                    </h2>
                                    <p className="text-sm text-slate-500 dark:text-zinc-400 mt-2">원하시는 레시피를 선택하여 상세 조리 과정을 확인하세요.</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {subCategoryData.subCategories.map((sub, idx) => (
                                        <div key={idx} onClick={() => executeFetchRecipe(sub.name)} className="group bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-6 rounded-2xl hover:border-amber-400 dark:hover:border-amber-500 hover:shadow-md cursor-pointer transition-all flex justify-between items-center">
                                            <div>
                                                <h3 className="text-lg font-bold text-slate-900 dark:text-white group-hover:text-amber-600 dark:group-hover:text-amber-400 transition-colors">{sub.name}</h3>
                                                <p className="text-sm text-slate-500 dark:text-zinc-400 mt-1">{sub.desc}</p>
                                            </div>
                                            <i className="fa-solid fa-arrow-right text-slate-300 dark:text-zinc-600 group-hover:text-amber-500 group-hover:translate-x-1 transition-all"></i>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Recipe Detail */}
                        {recipe && !loading && (
                            <div className="space-y-8">
                                <div className="relative w-full h-[35vh] sm:h-[45vh] rounded-3xl overflow-hidden shadow-md border border-slate-200 dark:border-zinc-800 isolate bg-slate-100 dark:bg-zinc-900 flex items-center justify-center">
                                    {/* Fallback Icon if image fails/isn't real */}
                                    <i className="absolute fa-solid fa-image text-slate-300 dark:text-zinc-800 text-6xl"></i>
                                    <img
                                        src={`https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=1600&q=80`}
                                        alt={recipe.title}
                                        className="absolute inset-0 w-full h-full object-cover z-10"
                                        onError={(e) => { e.target.style.display = 'none'; }}
                                    />
                                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/30 to-transparent z-20"></div>
                                    <div className="absolute inset-0 p-6 sm:p-10 flex flex-col justify-between z-30">
                                        <div className="flex justify-between items-start">
                                            <span className="bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-sm">Chef's Choice</span>
                                            <button type="button" onClick={handleLikeToggle} className="bg-white/20 hover:bg-white/30 backdrop-blur-md border border-white/30 text-white px-4 py-2.5 rounded-full flex items-center gap-2 text-sm font-bold transition-all">
                                                <i className={`${currentLikeData.liked ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart`}></i>
                                                <span>{currentLikeData.count}</span>
                                            </button>
                                        </div>
                                        <div>
                                            <h2 className="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">{recipe.title}</h2>
                                            <p className="text-slate-200 mt-3 text-sm sm:text-base font-medium max-w-2xl leading-relaxed">{recipe.description}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 sm:grid-cols-6 gap-3 sm:gap-4">
                                    {[
                                        { label: '준비 시간', value: recipe.prepTime, icon: 'fa-stopwatch' },
                                        { label: '조리 시간', value: recipe.cookTime, icon: 'fa-fire-burner' },
                                        { label: '인분', value: recipe.servings, icon: 'fa-user-group' },
                                        { label: '난이도', value: recipe.difficulty, icon: 'fa-star' },
                                        { label: '칼로리', value: recipe.calories, icon: 'fa-bolt' },
                                        { label: '예상 비용', value: recipe.estimatedCost, icon: 'fa-won-sign' },
                                    ].map((stat, idx) => (
                                        <div key={idx} className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-4 sm:p-5 rounded-2xl flex flex-col items-center text-center shadow-sm">
                                            <i className={`fa-solid ${stat.icon} text-slate-400 dark:text-zinc-500 mb-2`}></i>
                                            <div className="text-[10px] sm:text-xs font-semibold text-slate-500 dark:text-zinc-400 uppercase tracking-wider">{stat.label}</div>
                                            <div className="font-bold text-slate-900 dark:text-white mt-1 text-sm">{stat.value}</div>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-6 sm:p-8 rounded-3xl shadow-sm">
                                    <div className="flex justify-between items-end mb-4">
                                        <div>
                                            <h3 className="text-base font-bold text-slate-900 dark:text-white">진행 상황</h3>
                                            <p className="text-sm text-slate-500 dark:text-zinc-400 mt-1">{completedCount} / {totalSteps} 단계 완료</p>
                                        </div>
                                        <span className="text-2xl font-extrabold text-amber-500">{progressPercent}%</span>
                                    </div>
                                    <div className="w-full bg-slate-100 dark:bg-zinc-800 h-2.5 rounded-full overflow-hidden">
                                        <div className="bg-amber-500 h-full transition-all duration-500 ease-out" style={{ width: `${progressPercent}%` }}></div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <div className="lg:col-span-1 space-y-4">
                                        <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2 border-b border-slate-200 dark:border-zinc-800 pb-3">
                                            <i className="fa-solid fa-basket-shopping text-slate-400"></i> 재료 준비
                                        </h3>
                                        <ul className="space-y-2 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-5 rounded-2xl shadow-sm">
                                            {(recipe.ingredients || []).map((ing, idx) => (
                                                <li key={idx} className="flex justify-between items-center py-2.5 border-b border-slate-100 dark:border-zinc-800/50 last:border-0 text-sm">
                                                    <span className="text-slate-800 dark:text-zinc-200 font-medium">{ing.split(' (')[0]}</span>
                                                    <span className="text-slate-500 dark:text-zinc-400 text-xs bg-slate-50 dark:bg-zinc-800 px-2 py-1 rounded-md">{ing.includes('(') ? ing.split('(')[1].replace(')', '') : ''}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>

                                    <div className="lg:col-span-2 space-y-4">
                                        <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2 border-b border-slate-200 dark:border-zinc-800 pb-3">
                                            <i className="fa-solid fa-list-check text-slate-400"></i> 조리 순서
                                        </h3>
                                        <div className="relative border-l-2 border-slate-100 dark:border-zinc-800 ml-4 space-y-6 pb-4 pt-2">
                                            {(recipe.steps || []).map((step, idx) => {
                                                const isChecked = checkedSteps[idx];
                                                return (
                                                    <div key={idx} className="relative pl-8 sm:pl-10">
                                                        <button
                                                            type="button"
                                                            onClick={() => toggleCheckStep(idx)}
                                                            className={`absolute -left-[17px] sm:-left-[19px] top-0 w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center text-sm font-bold transition-all border-4 border-slate-50 dark:border-zinc-950 ${isChecked ? 'bg-amber-500 text-white border-amber-100 dark:border-amber-900/30' : 'bg-white dark:bg-zinc-800 text-slate-500 dark:text-zinc-400 shadow-sm'}`}
                                                        >
                                                            {isChecked ? <i className="fa-solid fa-check"></i> : (idx + 1)}
                                                        </button>
                                                        
                                                        <div className={`transition-all duration-300 bg-white dark:bg-zinc-900 border ${isChecked ? 'border-amber-200 dark:border-amber-900/50 shadow-sm' : 'border-slate-200 dark:border-zinc-800'} p-5 sm:p-6 rounded-2xl`}>
                                                            <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-2 mb-3">
                                                                <h4 className={`text-base font-medium leading-relaxed ${isChecked ? 'text-slate-400 dark:text-zinc-500 line-through' : 'text-slate-800 dark:text-zinc-100'}`}>
                                                                    {step.instruction}
                                                                </h4>
                                                                <span className="text-xs font-semibold px-2.5 py-1 bg-slate-50 dark:bg-zinc-800 text-slate-500 dark:text-zinc-400 rounded-md shrink-0 self-start whitespace-nowrap border border-slate-100 dark:border-zinc-700">
                                                                    <i className="fa-regular fa-clock mr-1"></i>{step.duration}
                                                                </span>
                                                            </div>
                                                            <div className="mt-3 bg-slate-50 dark:bg-zinc-950/50 p-3 rounded-xl border border-slate-100 dark:border-zinc-800/50 flex items-center gap-2">
                                                                <i className="fa-solid fa-pen text-slate-300 dark:text-zinc-600 text-xs"></i>
                                                                <input
                                                                    type="text"
                                                                    value={stepNotes[idx] || ''}
                                                                    onChange={(e) => handleNoteChange(idx, e.target.value)}
                                                                    placeholder="개인적인 메모나 팁을 남겨보세요."
                                                                    className="w-full text-sm bg-transparent text-slate-700 dark:text-zinc-300 placeholder-slate-400 dark:placeholder-zinc-600 outline-none"
                                                                />
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Recent Searches */}
                        {!recipe && !subCategoryData && (recentSearches || []).length > 0 && (
                            <div className="mt-12 w-full max-w-2xl mx-auto border-t border-slate-200 dark:border-zinc-800 pt-8">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-sm font-semibold text-slate-500 dark:text-zinc-400">최근 검색 기록</h3>
                                    <button type="button" onClick={clearAllRecentSearches} className="text-xs font-medium text-slate-400 hover:text-slate-700 dark:text-zinc-500 dark:hover:text-zinc-300 transition-colors">전체 삭제</button>
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    {(recentSearches || []).map((term, index) => (
                                        <div key={index} className="group flex items-center gap-2 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 px-4 py-2 rounded-full text-sm font-medium text-slate-700 dark:text-zinc-300 cursor-pointer hover:border-slate-300 dark:hover:border-zinc-600 transition-colors shadow-sm">
                                            <span onClick={() => { setQuery(term); handleSearch(term); }}>{term}</span>
                                            <i className="fa-solid fa-xmark text-slate-300 dark:text-zinc-600 hover:text-rose-500 dark:hover:text-rose-400" onClick={(e) => removeRecentSearch(e, term)}></i>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modals (Stats) */}
                    {showStatsModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm">
                            <div className="bg-white dark:bg-zinc-900 rounded-[2rem] max-w-sm w-full p-8 shadow-2xl border border-slate-100 dark:border-zinc-800">
                                <div className="flex justify-between items-center mb-8">
                                    <h3 className="text-xl font-bold text-slate-900 dark:text-white">요리 통계</h3>
                                    <button type="button" onClick={() => setShowStatsModal(false)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-zinc-800 flex items-center justify-center text-slate-500 dark:text-zinc-400 hover:bg-slate-200 dark:hover:bg-zinc-700 transition-colors"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="space-y-5">
                                    <div className="bg-slate-50 dark:bg-zinc-800/50 p-5 rounded-2xl border border-slate-100 dark:border-zinc-800">
                                        <div className="text-xs font-semibold text-slate-500 dark:text-zinc-400 mb-1">총 요리 완성 횟수</div>
                                        <div className="text-3xl font-extrabold text-slate-900 dark:text-white">{totalCookCount}<span className="text-base font-medium text-slate-500 ml-1">회</span></div>
                                    </div>
                                    <div className="pt-2">
                                        <h4 className="text-sm font-semibold text-slate-900 dark:text-white mb-4">가장 많이 찾은 레시피</h4>
                                        <div className="space-y-4">
                                            {chartData.length === 0 ? (
                                                <p className="text-sm text-slate-400 text-center py-4">아직 기록이 없습니다.</p>
                                            ) : (
                                                chartData.map(([dish, count], index) => {
                                                    const barPercentage = Math.max(Math.round((count / maxChartCount) * 100), 10);
                                                    return (
                                                        <div key={index} className="space-y-2">
                                                            <div className="flex justify-between text-sm font-medium text-slate-700 dark:text-zinc-300">
                                                                <span className="truncate pr-2">{dish}</span><span className="text-slate-900 dark:text-white font-bold">{count}회</span>
                                                            </div>
                                                            <div className="w-full bg-slate-100 dark:bg-zinc-800 h-2 rounded-full overflow-hidden">
                                                                <div className="bg-slate-800 dark:bg-slate-200 h-full rounded-full" style={{ width: `${barPercentage}%` }}></div>
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modals (History) */}
                    {showHistoryModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm">
                            <div className="bg-white dark:bg-zinc-900 rounded-[2rem] max-w-lg w-full p-6 shadow-2xl flex flex-col max-h-[85vh] border border-slate-100 dark:border-zinc-800">
                                <div className="flex justify-between items-center mb-6 px-2">
                                    <h3 className="text-xl font-bold text-slate-900 dark:text-white">요리 보관함</h3>
                                    <button type="button" onClick={() => setShowHistoryModal(false)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-zinc-800 flex items-center justify-center text-slate-500 dark:text-zinc-400 hover:bg-slate-200 dark:hover:bg-zinc-700 transition-colors"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-3 px-2">
                                    {safeHistory.length === 0 ? (
                                        <div className="flex flex-col items-center justify-center py-12">
                                            <i className="fa-solid fa-book-open text-4xl text-slate-200 dark:text-zinc-700 mb-4"></i>
                                            <p className="text-slate-500 dark:text-zinc-400 text-sm">요리를 완료하면 이곳에 기록이 저장됩니다.</p>
                                        </div>
                                    ) : (
                                        safeHistory.map((item, idx) => (
                                            <div key={idx} className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-4 rounded-2xl flex justify-between items-center shadow-sm">
                                                <div>
                                                    <h4 className="font-bold text-slate-900 dark:text-white text-base">{item.title}</h4>
                                                    <p className="text-xs text-slate-500 dark:text-zinc-400 mt-1.5 font-medium flex items-center gap-2">
                                                        <span><i className="fa-regular fa-calendar mr-1"></i>{item.date}</span>
                                                        <span className="w-1 h-1 rounded-full bg-slate-300 dark:bg-zinc-600"></span>
                                                        <span><i className="fa-solid fa-fire mr-1 text-slate-400"></i>{item.calories}</span>
                                                    </p>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                {safeHistory.length > 0 && (
                                    <div className="mt-4 pt-4 border-t border-slate-100 dark:border-zinc-800 text-center">
                                        <button type="button" onClick={clearHistory} className="text-sm font-medium text-slate-400 hover:text-rose-500 dark:text-zinc-500 dark:hover:text-rose-400 transition-colors px-4 py-2">전체 기록 삭제</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
